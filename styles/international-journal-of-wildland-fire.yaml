extends: springer-basic-author-date
info:
  title: International Journal of Wildland Fire
  description: "This style produces the CSIRO style used in the International Journal of Wildland Fire,\n      the Australian Journal of Botany and several other Australian journals.  It has been\n      validated for the journal, book, book chapter, report, and conference paper citation\n      styles.  This style is in the public domain."
  fields:
  - science
  source:
    csl-id: http://www.zotero.org/styles/international-journal-of-wildland-fire
    adapted-by: citum-migrate
    license: http://creativecommons.org/licenses/by-sa/3.0/
    original-authors:
    - name: David Weise
      email: dweise@fs.fed.us
    links:
    - href: http://www.zotero.org/styles/international-journal-of-wildland-fire
      rel: self
    - href: http://www.zotero.org/styles/springer-basic-author-date
      rel: template
    - href: http://www.publish.csiro.au/nid/117/aid/424.htm
      rel: documentation
options:
  substitute: editor-translator-title-short
  processing:
    sort:
      shorten-names: false
      render-substitutions: false
      template:
      - key: year
        ascending: true
      - key: author
        ascending: true
    group:
      template:
      - year
      - author
    disambiguate:
      names: true
      add-givenname: false
      year-suffix: true
  contributors:
    display-as-sort: all
    name-form: initials
    initialize-with: ''
    shorten:
      min: 3
      use-first: 1
      and-others: et-al
      delimiter-precedes-last: contextual
    delimiter: ', '
    delimiter-precedes-last: always
    demote-non-dropping-particle: sort-only
    sort-separator: ' '
  dates: long
  titles: journal-emphasis
citation:
  # source (international-journal-of-wildland-fire.csl): collapse="year-suffix"
  # — SAME_AUTHOR_COLLAPSE.md §7 v1.1. Also inherited from
  # springer-basic-author-date-core (Custom regime, no cross-family reset);
  # declared explicitly here since this style's own source requests it.
  collapse:
    same-author:
      year-suffix: merged
  options:
    contributors:
      name-form: initials
      initialize-with: ''
      shorten:
        min: 3
        use-first: 1
        and-others: et-al
        delimiter-precedes-last: contextual
      delimiter: ', '
  template:
  - contributor: author
    form: short
    name-order: family-first
    shorten:
      min: 3
      use-first: 1
      and-others: et-al
      delimiter-precedes-last: contextual
  - date: issued
    form: year
    prefix: ' '
  - variable: locator
  wrap:
    punctuation: parentheses
  delimiter: '. '
  multi-cite-delimiter: '; '
bibliography:
  options:
    contributors:
      display-as-sort: all
      name-form: initials
      initialize-with: ''
      delimiter: ', '
      delimiter-precedes-last: always
      sort-separator: ' '
    hanging-indent: true
    separator: '. '
  type-variants:
    article-journal:
    - contributor: author
      form: long
      name-order: family-first
    - date: issued
      form: year
      wrap:
        punctuation: parentheses
      prefix: ' '
    - title: primary
      prefix: ' '
    - group:
      - contributor: editor
        form: verb
        name-order: given-first
      - title: parent-monograph
        emph: true
    - title: parent-serial
      emph: true
    - group:
      - number: volume
      - number: issue
        wrap:
          punctuation: parentheses
    - number: pages
      prefix: ', '
    - variable: publisher
      prefix: . (
    - variable: publisher-place
      prefix: ': '
    - variable: doi
      prefix: https://doi.org/
    chapter:
    - contributor: author
      form: long
      name-order: family-first
    - date: issued
      form: year
      wrap:
        punctuation: parentheses
      prefix: ' '
    - title: primary
      prefix: ' '
    - group:
      - contributor: editor
        form: verb
        name-order: given-first
      - title: parent-monograph
        emph: true
    - title: parent-serial
      emph: true
    - group:
      - number: volume
      - number: issue
        wrap:
          punctuation: parentheses
    - number: pages
      label-form: short
    - variable: publisher
      prefix: . (
    - variable: publisher-place
      prefix: ': '
    - variable: doi
    paper-conference:
    - contributor: author
      form: long
      name-order: family-first
    - date: issued
      form: year
      wrap:
        punctuation: parentheses
      prefix: ' '
    - title: primary
      prefix: ' '
    - group:
      - contributor: editor
        form: verb
        name-order: given-first
      - title: parent-monograph
        emph: true
    - title: parent-serial
      emph: true
    - group:
      - number: volume
      - number: issue
        wrap:
          punctuation: parentheses
    - number: pages
      label-form: short
    - variable: publisher
      prefix: . (
    - variable: publisher-place
      prefix: ': '
    - variable: doi
  template:
  - contributor: author
    form: long
    name-order: family-first
  - date: issued
    form: year
    wrap:
      punctuation: parentheses
    prefix: ' '
  - title: primary
    prefix: ' '
  - group:
    - contributor: editor
      form: verb
      name-order: given-first
    - title: parent-monograph
      emph: true
  - title: parent-serial
    emph: true
  - group:
    - number: volume
    - number: issue
      wrap:
        punctuation: parentheses
  - number: pages
    prefix: ', '
  - variable: publisher
    prefix: . (
  - variable: publisher-place
    prefix: ': '
  - variable: doi
