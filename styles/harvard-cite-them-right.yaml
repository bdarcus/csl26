info:
  title: Cite Them Right 12th edition (author-date/Harvard)
  description: Harvard according to Cite Them Right, 11th edition.
  source:
    csl-id: http://www.zotero.org/styles/harvard-cite-them-right
    adapted-by: citum-migrate
    license: http://creativecommons.org/licenses/by-sa/3.0/
    original-authors:
    - name: Patrick O'Brien
    links:
    - href: http://www.zotero.org/styles/harvard-cite-them-right
      rel: self
    - href: http://www.zotero.org/styles/harvard-cite-them-right-11th-edition
      rel: template
    - href: http://www.citethemrightonline.com/
      rel: documentation
  short-name: "Harvard"
options:
  substitute:
    contributor-role-form: short
    candidates:
    - editor
    - translator
    overrides:
      article-newspaper article-magazine article-journal: none
  date-fallback:
    first-issued:
      default:
      - message: term.no-date
        form: long
  processing:
    sort:
      shorten-names: false
      render-substitutions: false
      template:
      - key: year
        ascending: true
    group:
      template:
      - year
    disambiguate:
      names: true
      add-givenname: true
      year-suffix: true
  contributors:
    display-as-sort: all
    name-form: initials
    initialize-with: .
    shorten:
      min: 4
      use-first: 1
      and-others: et-al
      delimiter-precedes-last: contextual
    delimiter: ", "
    delimiter-precedes-last: never
    demote-non-dropping-particle: sort-only
  dates:
    month: long
    uncertainty-marker: "?"
    approximation-marker: "ca. "
    range-delimiter: –
  titles:
    monograph:
      emph: true
    periodical:
      emph: true
    serial:
      emph: true
  punctuation-in-quote: true
citation:
  # source (harvard-cite-them-right.csl): collapse="year" —
  # SAME_AUTHOR_COLLAPSE.md §7 v1.1
  collapse:
    same-author: {}
  options:
    contributors:
      name-form: initials
      initialize-with: ". "
      shorten:
        min: 4
        use-first: 1
        and-others: et-al
        delimiter-precedes-last: contextual
      delimiter: ", "
      delimiter-precedes-last: never
  template:
  - contributor: author
    form: short
    name-order: family-first
  - date: issued
    form: year
    prefix: ", "
  - variable: locator
    prefix: ", "
  wrap:
    punctuation: parentheses
  delimiter: ". "
  multi-cite-delimiter: "; "
bibliography:
  options:
    contributors:
      display-as-sort: all
      name-form: initials
      initialize-with: .
      shorten:
        min: 4
        use-first: 1
        and-others: et-al
        delimiter-precedes-last: contextual
      delimiter-precedes-last: never
    entry-suffix: .
    separator: ", "
  type-variants:
    article-journal:
      modify:
        - match:
            number: pages
          label-form: short
        - match:
            variable: doi
          prefix: https://doi.org/
    article-magazine:
      modify:
        - match:
            number: pages
          label-form: short
      remove:
        - match:
            group:
              - number: volume
              - number: issue
                wrap:
                  punctuation: parentheses
      add:
        - component:
            group:
              - number: volume
          before:
            number: pages
    chapter:
      modify:
        - match:
            number: pages
          label-form: short
      remove:
        - match:
            group:
              - contributor: editor
                form: verb
                name-order: given-first
                shorten:
                  min: 4
                  use-first: 1
              - title: parent-monograph
                emph: true
      add:
        - component:
            prefix: ', in '
            group:
              - contributor: editor
                form: verb
                name-order: given-first
                shorten:
                  min: 4
                  use-first: 1
                prefix: 'in '
              - title: parent-monograph
                emph: true
          before:
            title: parent-serial
    paper-conference:
      modify:
        - match:
            number: pages
          label-form: short
  template:
  - contributor: author
    form: long
    name-order: family-first
    shorten:
      min: 5
      use-first: 1
  - date: issued
    form: year
    wrap:
      punctuation: parentheses
    prefix: " "
  - title: primary
    wrap:
      punctuation: quotes
    prefix: " "
  - prefix: ", in "
    group:
    - contributor: editor
      form: verb
      name-order: given-first
      shorten:
        min: 4
        use-first: 1
    - title: parent-monograph
      emph: true
  - title: parent-serial
    emph: true
  - variable: publisher-place
  - variable: publisher
    prefix: ": "
  - group:
    - number: volume
    - number: issue
      wrap:
        punctuation: parentheses
  - number: pages
  - variable: doi
  - variable: url
  sort: author-date-title
