# yaml-language-server: $schema=https://docs.citum.org/schemas/style.json
extends: ieee
info:
  title: American Society of Mechanical Engineers
  description: A style for the ASME's 23 journals
  fields:
  - engineering
  source:
    csl-id: http://www.zotero.org/styles/american-society-of-mechanical-engineers
    adapted-by: citum-migrate
    license: http://creativecommons.org/licenses/by-sa/3.0/
    original-authors:
    - name: Richard Karnesky
      email: karnesky+zotero@gmail.com
      uri: http://arc.nucapt.northwestern.edu/Richard_Karnesky
    links:
    - href: http://www.zotero.org/styles/american-society-of-mechanical-engineers
      rel: self
    - href: http://www.zotero.org/styles/ieee
      rel: template
    - href: https://www.asme.org/publications-submissions/journals/information-for-authors/journal-guidelines/references
      rel: documentation
options:
  contributors:
    display-as-sort: all
    name-form: initials
    initialize-with: '. '
    delimiter: ', '
    delimiter-precedes-last: always
    demote-non-dropping-particle: sort-only
    sort-separator: ', '
  titles: journal-emphasis
citation:
  template-ref: numeric-citation
  wrap:
    punctuation: brackets
  multi-cite-delimiter: ','
  # collapse: citation-number is NOT added here despite the source CSL
  # declaring it (see csl26-rgys). Adding it is inert: this style's citation
  # numbers render doubly-bracketed ([[1],[2],[3]]) via a pre-existing,
  # unrelated defect in ASME's numeric-citation/wrap interaction — the same
  # defect blocks should_collapse_citation_numbers's mode gate from ever
  # seeing CitationMode::NonIntegral. Filed as csl26-aafz; fix that first.
bibliography:
  options:
    contributors:
      display-as-sort: all
      name-form: initials
      initialize-with: '. '
      delimiter: ', '
      delimiter-precedes-last: always
      sort-separator: ', '
    entry-suffix: .
    separator: ', '
    second-field-align: flush
  type-variants:
    article-journal:
    - contributor: author
      form: long
      name-order: family-first
    - date: issued
      form: year
    - title: primary
      wrap:
        punctuation: quotes
    - title: parent-monograph
    - title: parent-serial
    - group:
      - number: volume
      - number: issue
        wrap:
          punctuation: parentheses
    - variable: url
    - variable: publisher
    - number: pages
      label-form: short
    - variable: doi
      prefix: https://doi.org/
    - variable: publisher-place
    article-magazine:
    - contributor: author
      form: long
      name-order: family-first
    - date: issued
      form: year
    - title: primary
      wrap:
        punctuation: quotes
    - title: parent-monograph
    - title: parent-serial
    - group:
      - number: volume
      - number: issue
        wrap:
          punctuation: parentheses
    - variable: url
    - variable: publisher
    - number: pages
      label-form: short
    - variable: doi
      prefix: '. '
    - variable: publisher-place
    chapter:
    - contributor: author
      form: long
      name-order: family-first
    - date: issued
      form: year
    - title: primary
      wrap:
        punctuation: quotes
    - title: parent-monograph
    - title: parent-serial
    - group:
      - number: volume
      - number: issue
        wrap:
          punctuation: parentheses
    - variable: url
    - variable: publisher
    - number: pages
      label-form: short
    - variable: doi
      prefix: '. '
    - variable: publisher-place
    entry-encyclopedia:
    - contributor: author
      form: long
      name-order: family-first
    - date: issued
      form: year
    - title: primary
      wrap:
        punctuation: quotes
    - title: parent-monograph
      emph: false
    - title: parent-serial
    - group:
      - number: volume
      - number: issue
        wrap:
          punctuation: parentheses
    - variable: url
    - variable: publisher
    - number: pages
      label-form: short
    - variable: doi
      prefix: '. '
    - variable: publisher-place
    paper-conference:
    - contributor: author
      form: long
      name-order: family-first
    - date: issued
      form: year
    - title: primary
      wrap:
        punctuation: quotes
    - title: parent-monograph
    - title: parent-serial
    - group:
      - number: volume
      - number: issue
        wrap:
          punctuation: parentheses
    - variable: url
    - variable: publisher
    - number: pages
      label-form: short
    - variable: doi
      prefix: '. '
    - variable: publisher-place
    # citeproc-js does not italicize the dictionary/encyclopedia container
    # title (unlike a chapter's book container); the generic `template`
    # fallback's plain `title: parent-monograph` inherits emph:true from
    # the style's monograph config, so this dedicated variant overrides it.
    # See csl26-svfg / STYLE_INHERITANCE.md rule 1 and 3.
    entry-dictionary:
    - contributor: author
      form: long
      name-order: family-first
    - date: issued
      form: year
    - title: primary
      wrap:
        punctuation: quotes
    - title: parent-monograph
      emph: false
    - title: parent-serial
    - group:
      - number: volume
      - number: issue
        wrap:
          punctuation: parentheses
    - variable: url
    - variable: publisher
    - number: pages
    - variable: doi
      prefix: '. '
    - variable: publisher-place
  template:
  - contributor: author
    form: long
    name-order: family-first
  - date: issued
    form: year
  - title: primary
    wrap:
      punctuation: quotes
  - title: parent-monograph
  - title: parent-serial
  - group:
    - number: volume
    - number: issue
      wrap:
        punctuation: parentheses
  - variable: url
  - variable: publisher
  - number: pages
  - variable: doi
    prefix: '. '
  - variable: publisher-place
