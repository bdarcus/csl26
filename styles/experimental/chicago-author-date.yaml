# yaml-language-server: $schema=https://docs.citum.org/schemas/style.json
info:
  title: "Chicago Manual of Style 18th edition (author-date)"
  id: "chicago-author-date"
  link: "https://www.chicagomanualofstyle.org/"
  authors:
  - name: "Bruce D'Arcus"
    uri: "https://github.com/bdarcus"
  categories:
  - author-date
  - generic-base
  license: "http://creativecommons.org/licenses/by-sa/3.0/"

options:
  processing: author-date
  date-fallback: standard
  substitute:
    candidates:
    - editor
    - translator
    - title
  contributors:
    and: text
    name-form: initials
    initialize-with: ". "
    # For author-date, CMOS uses family-first only for the first author in bib
    display-as-sort: first
    delimiter-precedes-last: always
    shorten:
      min: 10
      use-first: 7
  dates:
    month: long

citation:
  # source (chicago-author-date.csl): collapse="year" —
  # SAME_AUTHOR_COLLAPSE.md §7 v1.1
  collapse:
    same-author: {}
  sort:
    template:
    - key: author
    - key: issued
  options:
    contributors:
      name-form: full
      shorten:
        # 3 or more authors -> Author1 et al.
        min: 3
        use-first: 1
  non-integral:
    wrap:
      punctuation: parentheses
    delimiter: ", "
    template:
    - delimiter: " "
      group:
      - contributor: author
        form: short
      - date: issued
        form: year
    - variable: locator
  integral:
    delimiter: " "
    template:
    - contributor: author
      form: short
    - delimiter: ", "
      wrap:
        punctuation: parentheses
      group:
      - date: issued
        form: year
      - variable: locator
bibliography:
  options:
    # CMOS 18th ed. §14.67: repeated author group replaced by 3-em-dash
    subsequent-author-substitute: "———"
    subsequent-author-substitute-rule: complete-all
    contributors:
      display-as-sort: first
      # Show up to 10 authors, then truncate
      shorten:
        min: 11
        use-first: 7
  type-variants:
    article-journal:
    - contributor: author
      form: long
      suffix: "."
    - date: issued
      form: year
      suffix: "."
    - title: primary
      suffix: "."
      wrap:
        punctuation: quotes
    - delimiter: " "
      suffix: "."
      group:
      - delimiter: " "
        group:
        - message: pattern.in-container
          args:
            container:
              group:
                - title: parent-monograph
                  emph: true
                - contributor: editor
                  form: verb
              delimiter: " "
      - title: parent-serial
        form: long
        emph: true
      - group: &id002
        - group:
          - number: volume
          - number: issue
            wrap:
              punctuation: parentheses
          delimiter: ' '
        - number: pages
          prefix: ": "
        delimiter: ''
    - delimiter: { mark: period }
      suffix: "."
      group:
      - variable: publisher-place
      - variable: publisher
    chapter:
    - contributor: author
      form: long
      suffix: "."
    - date: issued
      form: year
      suffix: "."
    - title: primary
      suffix: "."
      wrap:
        punctuation: quotes
    - delimiter: " "
      suffix: "."
      group:
      - delimiter: " "
        group:
        - message: pattern.in-container
          args:
            container:
              group:
                - title: parent-monograph
                  emph: true
                - contributor: editor
                  form: verb
              delimiter: " "
      - title: parent-serial
        form: long
        emph: true
      - group: *id002
        delimiter: ''
    - delimiter: { mark: period }
      suffix: "."
      group:
      - variable: publisher-place
      - variable: publisher
  template:
  - contributor: author
    form: long
    suffix: "."
  - date: issued
    form: year
    suffix: "."
  - title: primary
    suffix: "."
  - delimiter: " "
    suffix: "."
    group:
    - delimiter: " "
      group:
      - message: pattern.in-container
        args:
          container:
            group:
              - title: parent-monograph
                emph: true
              - contributor: editor
                form: verb
            delimiter: " "
    - title: parent-serial
      form: long
      emph: true
    - delimiter: ""
      group:
      - delimiter: " "
        group:
        - number: volume
        - number: issue
          wrap:
            punctuation: parentheses
      - number: pages
        prefix: ": "
  - delimiter: { mark: period }
    suffix: "."
    group:
    - variable: publisher-place
    - variable: publisher
