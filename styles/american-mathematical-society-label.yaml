extends: elsevier-with-titles
info:
  title: American Mathematical Society (label)
  fields:
  - math
  source:
    csl-id: http://www.zotero.org/styles/american-mathematical-society-label
    adapted-by: citum-migrate
    license: http://creativecommons.org/licenses/by-sa/3.0/
    original-authors:
    - name: American Mathematical Society
      email: tech-support@ams.org
      uri: https://www.ams.org
    links:
    - href: http://www.zotero.org/styles/american-mathematical-society-label
      rel: self
    - href: http://www.zotero.org/styles/elsevier-with-titles
      rel: template
    - href: https://www.ams.org/arc/styleguide
      rel: documentation
    - href: https://mirrors.ctan.org/biblio/bibtex/contrib/misc/amsplain.bst
      rel: documentation
options:
  processing:
    label:
      preset: ams
      single-author-chars: 4
      et-al-min: 5
      et-al-marker: ''
  contributors:
    display-as-sort: all
    name-form: full
    delimiter: ', '
    delimiter-precedes-last: always
    sort-separator: ', '
  # container-monograph must be set explicitly (not left to fall back to
  # monograph) because the inherited elsevier-with-titles-core ancestor
  # already sets an inert container-monograph block; deep merge preserves
  # that inert block over the ParentMonograph fallback to monograph. See
  # csl26-svfg / STYLE_INHERITANCE.md rule 1 and 3.
  titles:
    monograph:
      emph: true
    container-monograph:
      emph: true
    periodical:
      emph: true
    serial:
      emph: true
citation:
  sort: author-date-title
  options:
    # The trigraph label is processor-generated; the cluster-level `wrap` below
    # brackets the whole cluster (`[ABC96, DEF97]`). `label-wrap: none` cancels
    # the per-label `brackets` inherited from elsevier-with-titles, which would
    # otherwise double-bracket each label (`[[ABC96], [DEF97]]`).
    label-mode: alphabetic
    label-wrap: none
  wrap:
    punctuation: brackets
  delimiter: ''
  multi-cite-delimiter: ', '
bibliography:
  options:
    contributors:
      display-as-sort: all
      name-form: full
      delimiter: ', '
      delimiter-precedes-last: always
      sort-separator: ', '
    entry-suffix: .
    separator: ', '
    # Overrides the numeric label-mode inherited from elsevier-with-titles-core,
    # which would otherwise prepend a citation-number to every entry.
    label-mode: alphabetic
    label-wrap: brackets
    label-separator: ' '
  type-variants:
    article-journal:
    - contributor: author
      form: long
      name-order: family-first
    - title: primary
    - title: parent-monograph
    - title: parent-serial
    - variable: publisher
    - variable: publisher-place
    - number: volume
    - date: issued
      form: year
      wrap:
        punctuation: parentheses
      prefix: ' '
    - number: pages
      prefix: ' '
    # Identical to `template:` below, and STYLE004 flags it as redundant --
    # but it is not. `all` matches every type and is resolved before the
    # default template, which is what blocks the type-specific variants
    # inherited from elsevier-with-titles-core from winning. Removing it
    # drops oracle bibliography parity from 45/47 to 36/47.
    all:
    - contributor: author
      form: long
      name-order: family-first
    - title: primary
    - title: parent-monograph
    - title: parent-serial
    - variable: publisher
    - variable: publisher-place
    - number: volume
    - date: issued
      form: year
    - number: pages
      prefix: ' '
  template:
  - contributor: author
    form: long
    name-order: family-first
  - title: primary
  - title: parent-monograph
  - title: parent-serial
  - variable: publisher
  - variable: publisher-place
  - number: volume
  - date: issued
    form: year
  - number: pages
    prefix: ' '
