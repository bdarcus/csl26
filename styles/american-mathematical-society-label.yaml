# yaml-language-server: $schema=https://docs.citum.org/schemas/style.json
extends: elsevier-with-titles
info:
  title: American Mathematical Society (label)
  fields:
  - math
  source:
    csl-id: http://www.zotero.org/styles/american-mathematical-society-label
    adapted-by: citum-migrate
    license: http://creativecommons.org/licenses/by-sa/3.0/
    original-authors:
    - name: American Mathematical Society
      email: tech-support@ams.org
      uri: https://www.ams.org
    links:
    - href: http://www.zotero.org/styles/american-mathematical-society-label
      rel: self
    - href: http://www.zotero.org/styles/elsevier-with-titles
      rel: template
    - href: https://www.ams.org/arc/styleguide
      rel: documentation
    - href: https://mirrors.ctan.org/biblio/bibtex/contrib/misc/amsplain.bst
      rel: documentation
options:
  processing:
    label:
      preset: ams
      single-author-chars: 4
      et-al-min: 5
      et-al-marker: ''
  contributors:
    display-as-sort: all
    name-form: full
    delimiter: ', '
    delimiter-precedes-last: always
    sort-separator: ', '
  # container-monograph must be set explicitly (not left to fall back to
  # monograph) because the inherited elsevier-with-titles-core ancestor
  # already sets an inert container-monograph block; deep merge preserves
  # that inert block over the ParentMonograph fallback to monograph. See
  # csl26-svfg / STYLE_INHERITANCE.md rule 1 and 3.
  titles:
    monograph:
      emph: true
    container-monograph:
      emph: true
    periodical:
      emph: true
    serial:
      emph: true
citation:
  options:
    # The bracket wraps the whole cluster, not each marker, so the per-marker
    # bracket inherited from elsevier-with-titles is cancelled.
    label-mode: alphabetic
    label-wrap: none
  sort: author-date-title
  wrap:
    punctuation: brackets
  delimiter: ''
  multi-cite-delimiter: ', '
bibliography:
  options:
    contributors:
      display-as-sort: all
      name-form: full
      delimiter: ', '
      delimiter-precedes-last: always
      sort-separator: ', '
    entry-suffix: .
    separator: ', '
    # Each entry leads with its generated trigraph, then a space.
    # See docs/specs/REFERENCE_MARKERS.md.
    label-mode: alphabetic
    label-wrap: brackets
    label-separator: ' '
    second-field-align: flush
  type-variants:
    article-journal:
    - contributor: author
      form: long
      name-order: family-first
    - title: primary
    - title: parent-monograph
    - title: parent-serial
    - variable: publisher
    - variable: publisher-place
    - number: volume
    - date: issued
      form: year
      wrap:
        punctuation: parentheses
      prefix: ' '
    - number: pages
      prefix: ' '
  template:
  - contributor: author
    form: long
    name-order: family-first
  - title: primary
  - title: parent-monograph
  - title: parent-serial
  - variable: publisher
  - variable: publisher-place
  - number: volume
  - date: issued
    form: year
  - number: pages
    prefix: ' '
