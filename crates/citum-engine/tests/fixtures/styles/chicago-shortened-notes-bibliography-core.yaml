extends: chicago-notes-18th
info:
  title: Chicago Manual of Style 18th edition (shortened notes and bibliography)
  description: Chicago-style source citations (with Bluebook for legal citations), shortened author-title notes and bibliography system
  fields:
  - anthropology
  - communications
  - geography
  - history
  - humanities
  - law
  - linguistics
  - literature
  - philosophy
  - science
  - sociology
  - theology
  source:
    csl-id: http://www.zotero.org/styles/chicago-shortened-notes-bibliography
    adapted-by: citum-migrate
    license: http://creativecommons.org/licenses/by-sa/3.0/
    original-authors:
    - name: Andrew Dunning
      uri: https://orcid.org/0000-0003-0464-5036
    links:
    - href: http://www.zotero.org/styles/chicago-shortened-notes-bibliography
      rel: self
    - href: http://www.zotero.org/styles/chicago-notes-bibliography
      rel: template
    - href: https://www.chicagomanualofstyle.org/
      rel: documentation
  short-name: "Chicago Shortened Notes"
  edition: "18th edition"
  default-locale: en-US
options:
  multilingual: romanized-translated
  messages:
    pattern.chicago-of: "of {$container}"
    pattern.chicago-volume: "Vol. {$number}"
    pattern.chicago-volume-lower: "vol. {$number}"
  locale-override: en-US-chicago
  processing: note
  contributors:
    shorten:
      min: 7
      use-first: 3
      and-others: et-al
      delimiter-precedes-last: contextual
    demote-non-dropping-particle: display-and-sort
  titles: chicago
  page-range-format: chicago16
  punctuation-in-quote: true
citation:
  options:
    contributors:
      shorten:
        min: 3
        use-first: 1
        and-others: et-al
        delimiter-precedes-last: contextual
  # The shortened style has one author-title citation shape; do not inherit
  # the notes style's position-dependent grammar or its type-specific full
  # citation additions.
  ibid: ~
  subsequent: ~
  type-variants: ~
  template:
  - group:
    - contributor: author
      form: short
      name-order: family-first-only
      shorten:
        min: 3
        use-first: 1
    - group:
      - group:
        - title: primary
          wrap:
            punctuation: quotes
        render-when:
          field-present: genre
      - group:
        - title: primary
        render-when:
          field-absent: genre
      delimiter: ''
    delimiter: ", "
    render-when:
      field-present: author
  - group:
    - group:
      - group:
        - title: primary
          wrap:
            punctuation: quotes
        render-when:
          field-present: genre
      - group:
        - title: primary
        render-when:
          field-absent: genre
      delimiter: ''
    delimiter: ''
    render-when:
      field-absent: author
  - variable: locator
    prefix: ", "
  suffix: .
  multi-cite-delimiter: "; "
bibliography:
  options:
    contributors:
      shorten:
        min: 7
        use-first: 3
        and-others: et-al
        delimiter-precedes-last: contextual
    date-fallback:
      first-issued:
        manuscript: none
        collection: none
    hanging-indent: true
    entry-suffix: .
    entry-suffix-after-url: true
    entry-suffix-after-doi: true
    separator: ". "
    anonymous-entries: notes-only
  type-variants:
    article-journal:
    - contributor: author
      form: long
      name-order: family-first-only
      shorten:
        min: 8
        use-first: 3
    - title: primary
      text-case: title
    - group:
      - contributor: editor
        form: verb
        name-order: given-first
      - title: parent-monograph
        emph: true
    - group:
      - title: parent-serial
        emph: true
      - group:
        - number: volume
        - number: issue
          label-form: short
          prefix: ", "
        - date: issued
          form: year
          prefix: " "
          wrap:
            punctuation: parentheses
        prefix: " "
        delimiter: ""
      delimiter: ""
    - variable: publisher
    - number: pages
      prefix: ": "
    - variable: doi
      prefix: https://doi.org/
    - variable: url
    article-magazine:
    - contributor: author
      form: long
      name-order: family-first-only
      shorten:
        min: 8
        use-first: 3
    - title: primary
      text-case: title
    - title: parent-serial
      prefix: ", "
    - number: volume
      prefix: " "
    - number: issue
      label-form: short
      prefix: ", "
    - date: issued
      form: year
      prefix: ", "
    - variable: url
      prefix: ", "
    book:
    - contributor: author
      form: long
      name-order: family-first-only
      shorten:
        min: 8
        use-first: 3
    - group:
      - title: primary
        text-case: title
      render-when:
        field-absent: volume-or-issue
    - group:
      - group:
        - title: collection-title
          text-case: title
        - message: pattern.chicago-volume
          args:
            number:
              number: volume
          prefix: ". "
        - title: parent-monograph
          text-case: title
          prefix: ", "
        - number: part-number
          label-form: short
          prefix: ", "
        - group:
          - variable: volume-title
            emph: true
            text-case: title
            prefix: ", "
          render-when:
            field-present: volume-title
            field-absent: part-number-non-numeric
        - group:
          - title: primary
            text-case: title
            prefix: ", "
          render-when:
            field-absent: volume-title
        - group:
          - title: primary
            text-case: title
            prefix: ", "
          render-when:
            field-present: part-number-non-numeric
        - group:
          - group:
            - variable: volume-title
              emph: true
              text-case: title
              prefix: ", "
            render-when:
              field-present: volume-title
          - group:
            - title: primary
              text-case: title
              prefix: ", "
            render-when:
              field-absent: volume-title
          render-when:
            field-present: part-number-numeric
        delimiter: ""
        render-when:
          field-present: collection-title
      - group:
        - group:
          - title: parent-monograph
            text-case: title
          - message: pattern.chicago-volume
            args:
              number:
                number: volume
            prefix: ". "
          - group:
            - variable: volume-title
              emph: true
              text-case: title
              prefix: ", "
            render-when:
              field-present: volume-title
              field-absent: part-number-non-numeric
          - group:
            - title: primary
              text-case: title
              prefix: ", "
            render-when:
              field-absent: volume-title
          delimiter: ""
          render-when:
            field-absent: part-number
        - group:
          - title: parent-monograph
            text-case: title
          - message: pattern.chicago-volume
            args:
              number:
                number: volume
            prefix: ". "
          - title: primary
            text-case: title
            prefix: ", "
          - number: part-number
            label-form: short
            prefix: ", "
          delimiter: ""
          render-when:
            field-present: part-number-non-numeric
        - group:
          - group:
            - variable: volume-title
              emph: true
              text-case: title
              prefix: ", "
            render-when:
              field-present: volume-title
          - group:
            - title: primary
              text-case: title
              prefix: ", "
            render-when:
              field-absent: volume-title
          render-when:
            field-present: part-number-numeric
        delimiter: ""
        render-when:
          field-absent: collection-title
      delimiter: ""
      render-when:
        field-present: volume-or-issue
    - contributor: translator
      form: verb
      prefix: ". "
      text-case: capitalize-first
    - group:
      - contributor: editor
        form: verb
        name-order: given-first
        prefix: ". "
        text-case: capitalize-first
      render-when:
        field-absent: volume-or-issue
    - group:
      - message: pattern.chicago-volume
        args:
          number:
            number: volume
      - number: part-number
        label-form: short
      - message: pattern.chicago-of
        args:
          container:
            title: parent-monograph
            emph: true
      delimiter: ", "
      render-when:
        field-present: part-number-numeric
        field-absent: volume-or-issue
    - group:
      - group:
        - group:
          - number: part-number
            label-form: short
            text-case: capitalize-first
          - message: pattern.chicago-of
            args:
              container:
                title: parent-monograph
                emph: true
          delimiter: " "
        - group:
          - message: pattern.chicago-volume-lower
            args:
              number:
                number: volume
          - message: pattern.chicago-of
            args:
              container:
                title: collection-title
                emph: true
          delimiter: " "
        delimiter: ", "
        render-when:
          field-present: volume-title
      - group:
        - message: pattern.chicago-volume
          args:
            number:
              number: volume
        - number: part-number
          label-form: short
        - message: pattern.chicago-of
          args:
            container:
              title: parent-monograph
              emph: true
        delimiter: ", "
        render-when:
          field-absent: volume-title
      render-when:
        field-present: part-number-non-numeric
        field-absent: volume-or-issue
    - group:
      - number: number-of-volumes
        label-form: short
        prefix: ". "
      render-when:
        field-absent: volume-or-issue
    - variable: publisher
    - date: issued
      form: year
      prefix: ", "
    - variable: references
      prefix: ". "
    - variable: doi
      prefix: https://doi.org/
    chapter:
    - contributor: author
      form: long
      name-order: family-first-only
      shorten:
        min: 8
        use-first: 3
    - title: primary
      text-case: title
      prefix: ". "
      wrap:
        punctuation: quotes
    - message: pattern.in-container
      args:
        container:
          group:
            - title: parent-monograph
              emph: false
              text-case: title
            - contributor: editor
              form: verb
              name-order: given-first
              prefix: ", "
          delimiter: " "
      text-case: capitalize-first
      prefix: ". "
    - variable: publisher
      prefix: ". "
    - date: issued
      form: year
      prefix: ", "
    - variable: doi
      prefix: https://doi.org/
    manuscript:
    - contributor: author
      form: long
      name-order: family-first-only
      shorten:
        min: 8
        use-first: 3
    - title: primary
      text-case: title
      prefix: ". "
      wrap:
        punctuation: quotes
    - date: issued
      form: year
      prefix: ". "
    - variable: archive-location
      prefix: ". "
    - variable: archive-name
      prefix: ". "
    - variable: archive-place
      prefix: ", "
    # Some archival manuscripts in the Chicago corpus carry a narrow
    # `type: collection` note override. Keep that override on the archival
    # path so it does not fall through to the generic author/title template.
    collection:
    - contributor: author
      form: long
      name-order: family-first-only
      shorten:
        min: 7
        use-first: 3
    - title: primary
      text-case: title
    - variable: archive-location
      prefix: ". "
    - variable: archive-collection
      prefix: ". "
    - group:
      - variable: archive-name
      - variable: archive-place
        prefix: ", "
    entry-dictionary:
    - title: parent-monograph
      text-case: title
    - title: primary
      text-case: title
      prefix: ". "
      wrap:
        punctuation: quotes
    - message: pattern.accessed-date
      args:
        date:
          group:
            - date: accessed
              form: month-day
            - date: accessed
              form: year
              prefix: ", "
          delimiter: " "
      text-case: capitalize-first
      prefix: ". "
    - variable: url
      prefix: ". "
    legal-case:
    - contributor: author
      form: long
      name-order: family-first-only
      shorten:
        min: 8
        use-first: 3
    - title: primary
      text-case: title
    - group:
      - number: volume
      - variable: reporter
      - number: pages
      delimiter: " "
      prefix: ", "
    - group:
      - variable: authority
      - date: issued
        form: year
      delimiter: " "
      wrap:
        punctuation: parentheses
      prefix: " "
    personal-communication: []
    patent:
    - contributor: author
      form: long
      name-order: family-first-only
      shorten:
        min: 7
        use-first: 3
    - title: primary
    - group:
      - message: pattern.patent-number
        args:
          number:
            number: number
        text-case: capitalize-first
        prefix: ". "
    - message: pattern.issued-date
      args:
        date:
          group:
            - date: issued
              form: month-day
            - date: issued
              form: year
              prefix: ", "
      prefix: ", "
    standard:
    - variable: authority
    - title: primary
      prefix: ". "
      text-case: title
    - group:
      - variable: genre
      - number: number
        prefix: " "
      delimiter: ""
      prefix: ". "
    - variable: publisher
      prefix: ". "
    - group:
      - variable: status
      - group:
        - date: issued
          form: month-day
        - date: issued
          form: year
          prefix: ", "
        delimiter: ''
        prefix: " "
      delimiter: ""
      prefix: ", "
    - variable: doi
      prefix: ". https://doi.org/"
  template:
  - contributor: author
    form: long
    name-order: family-first-only
    shorten:
      min: 8
      use-first: 3
  - title: primary
  - group:
    - contributor: editor
      form: verb
      name-order: given-first
    - title: parent-monograph
      emph: true
  - title: parent-serial
    emph: true
  - number: volume
  - variable: publisher
  - date: issued
    form: year
    prefix: ", "
  - number: pages
    prefix: ": "
  - variable: doi
    prefix: https://doi.org/
  - variable: url

