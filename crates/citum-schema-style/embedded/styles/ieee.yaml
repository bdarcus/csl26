# yaml-language-server: $schema=https://docs.citum.org/schemas/style.json
info:
  title: IEEE Reference Guide version 11.29.2023
  description: IEEE style as per the 2023 guidelines.
  fields:
  - engineering
  source:
    csl-id: http://www.zotero.org/styles/ieee
    adapted-by: citum-migrate
    license: http://creativecommons.org/licenses/by-sa/3.0/
    original-authors:
    - name: Michael Berkowitz
      email: mberkowi@gmu.edu
    links:
    - href: http://www.zotero.org/styles/ieee
      rel: self
    - href: https://journals.ieeeauthorcenter.ieee.org/your-role-in-article-production/ieee-editorial-style-manual/
      rel: documentation
  short-name: "IEEE"
options:
  multilingual: romanized-only
  substitute:
    contributor-role-form: short-comma
    contributor-role-case: capitalize-first
    candidates: [editor, translator]
  processing: numeric
  contributors:
    name-form: initials
    initialize-with: ". "
    demote-non-dropping-particle: sort-only
  dates: short
  # Title rendering is a category-level policy, not a per-component one: the
  # engine keys it by reference type, and the substitute chain (a title standing
  # in for a missing author) reads it too — a template `wrap:` can never reach
  # that path. Component titles are quoted; standalone works are italicised.
  titles:
    # Keys are canonical Citum ref-type names (`Reference::ref_type`), which are
    # hyphenated — `type-mapping` is looked up verbatim and does not normalise
    # the CSL underscore spellings.
    type-mapping:
      # IEEE quotes theses and reports; the default table treats both as
      # monographs, which would italicise them instead.
      thesis: component
      report: component
      # Standalone works IEEE italicises but the default table leaves
      # uncategorised, so they would otherwise pick up `default`'s quotes.
      legal-case: monograph
      motion-picture: monograph
      software: monograph
      standard: monograph
      statute: monograph
    # IEEE quotes the title of the work itself and italicises only standalone
    # monographs, so `default` quotes rather than falling through to bare.
    default:
      quote: true
    component:
      quote: true
    monograph:
      emph: true
    periodical:
      emph: true
    serial:
      emph: true
  punctuation-in-quote: true
citation:
  options:
    label-mode: numeric
    # The bracket encloses the marker together with the locator (`[1, p. 737]`),
    # so it is an item wrap, not a label wrap. See docs/specs/REFERENCE_MARKERS.md.
    item-wrap: brackets
  template:
  - variable: locator
    prefix: ", "
  delimiter: ""
  multi-cite-delimiter: ", "
bibliography:
  options:
    contributors:
      name-form: initials
      initialize-with: ". "
      delimiter-precedes-last: contextual
    separator: ", "
    entry-suffix: .
    entry-suffix-after-doi: true
    label-mode: numeric
    label-wrap: brackets
    second-field-align: flush
  type-variants:
    article-journal:
      modify:
        - match:
            number: pages
          label-form: short
    article-magazine:
      modify:
        - match:
            number: pages
          label-form: short
    book:
      modify:
        - match:
            variable: publisher-place
          prefix: ". "
    chapter:
    - contributor: author
      form: long
      and: text
      name-order: given-first
      shorten:
        min: 7
        use-first: 1
    - title: primary
      wrap:
        punctuation: quotes
    - message: pattern.in-container
      args:
        container:
          title: parent-monograph
          emph: true
    - contributor: editor
      form: long
      name-order: given-first
      and: text
      label:
        term: editor
        form: short
        placement: suffix
        text-case: capitalize-first
    - variable: publisher-place
    - variable: publisher
      prefix: ": "
    - date: issued
      form: year
    - number: pages
      label-form: short
    entry-encyclopedia:
      modify:
        - match:
            number: pages
          label-form: short
    motion-picture:
      modify:
        - match:
            date: issued
          prefix: ", "
          wrap:
            punctuation: parentheses
    paper-conference:
    - contributor: author
      form: long
      and: text
      name-order: given-first
      shorten:
        min: 7
        use-first: 1
    - title: primary
      wrap:
        punctuation: quotes
    - message: pattern.in-container
      args:
        container:
          title: parent-monograph
          emph: true
    - date: issued
      form: year
    - number: pages
      label-form: short
    patent:
    - contributor: author
      form: long
      shorten:
        min: 7
        use-first: 1
        and-others: et-al
        delimiter-precedes-last: contextual
      and: text
    - title: primary
      quote: true
      wrap:
        punctuation: quotes
    - number: patent-number
    - date: issued
      form: full
    thesis:
    - contributor: author
      form: long
      and: text
      name-order: given-first
      shorten:
        min: 7
        use-first: 1
    - title: primary
      emph: false
      wrap:
        punctuation: quotes
    - variable: genre
    - variable: publisher
    - date: issued
      form: year
    standard:
    - title: primary
    - variable: standard-number
    - variable: publisher-place
      suffix: "."
    - date: issued
      form: full
    - variable: doi
      prefix: "doi: "
  template:
  - contributor: author
    form: long
    and: text
    name-order: given-first
    shorten:
      min: 7
      use-first: 1
  - title: primary
  - title: parent-monograph
    emph: true
  - title: parent-serial
    emph: true
  - number: edition
  - number: volume
    prefix: ", vol. "
  - number: issue
    prefix: ", no. "
  - variable: publisher-place
  - variable: publisher
    prefix: ": "
  - number: pages
  - date: issued
    form: year
  - variable: doi
    prefix: ", doi: "
  - variable: url
