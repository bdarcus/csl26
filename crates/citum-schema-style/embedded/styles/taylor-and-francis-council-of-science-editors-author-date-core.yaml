info:
  title: Taylor & Francis - Council of Science Editors (author-date)
  description: The Council of Science Editors style for T&F journals as per guidelines (version 2.0, 18 Jan 2018).
  fields:
  - science
  source:
    csl-id: http://www.zotero.org/styles/taylor-and-francis-council-of-science-editors-author-date
    adapted-by: citum-migrate
    license: http://creativecommons.org/licenses/by-sa/3.0/
    original-authors:
    - name: Sebastian Karcher
    links:
    - href: http://www.zotero.org/styles/taylor-and-francis-council-of-science-editors-author-date
      rel: self
    - href: http://www.zotero.org/styles/cse-name-year
      rel: template
    - href: https://files.taylorandfrancis.com/tf_c.pdf
      rel: documentation
options:
  multilingual: romanized-translated
  processing:
    sort:
      template:
      - key: author
      - key: year
    group:
      template: [author, year]
    disambiguate:
      # Migration bug (found while investigating unrelated exactParity
      # divergences on this style): real CSL sets
      # disambiguate-add-names="true" disambiguate-add-givenname="true" --
      # both were wrongly migrated as false.
      names: true
      add-givenname: true
      year-suffix: true
  substitute: editor-translator-title-long
  contributors:
    display-as-sort: all
    name-form: initials
    initialize-with: ""
    shorten:
      min: 12
      use-first: 10
      and-others: et-al
      delimiter-precedes-last: contextual
    delimiter: ", "
    delimiter-precedes-last: always
    demote-non-dropping-particle: sort-only
    sort-separator: " "
  dates: short
  punctuation-in-quote: true
citation:
  options:
    # citation-scoped per SUBSTITUTED_VALUE_FORMATTING.md's resolved decision.
    # Real taylor-and-francis-council-of-science-editors-author-date.csl's
    # `author`/`author-short` macros both render a substituted title with a
    # bare `<text variable="title" form="short"/>` -- no font-style or quotes
    # attribute, no type branching, in either citation or bibliography
    # context. Unlike apa-7th/elsevier-harvard, there is no italic bucket to
    # configure: every reference type genuinely renders plain, oracle-verified
    # (dead-sea-scrolls, plus book/report/article-journal fixtures) -- so no
    # `titles:` block is needed here. Absent `titles:`, category resolution
    # returns nothing and the title renders exactly as unset, matching the
    # real rule; this is the correct, complete config for this style, not an
    # oversight.
    substitute:
      title-quote: by-category
    contributors:
      shorten:
        min: 3
        use-first: 1
  template:
  - delimiter: " "
    group:
    - contributor: author
      form: short
      shorten:
        min: 3
        use-first: 1
        and-others: et-al
        delimiter-precedes-last: contextual
      and: text
    # Real CSL's `year-date` macro (used identically by <citation> and
    # <bibliography>) is a bare <date variable="issued"><date-part
    # name="year"/></date> with no fallback branch, so citeproc-js renders
    # nothing for a missing `issued` (e.g. "(Forthcoming)", not
    # "(Forthcoming n.d.)"). The style therefore leaves `date-fallback`
    # omitted, so all five `date: issued` sites below remain blank. See
    # csl26-7z59.
    - date: issued
      form: year
  - variable: locator
  wrap:
    punctuation: parentheses
  delimiter: ", "
  multi-cite-delimiter: "; "
bibliography:
  options:
    contributors:
      display-as-sort: all
      name-form: initials
      initialize-with: ""
      shorten:
        min: 12
        use-first: 10
        and-others: et-al
        delimiter-precedes-last: contextual
      delimiter: ", "
      delimiter-precedes-last: always
      sort-separator: " "
    hanging-indent: false
    separator: ". "
  type-variants:
    [article-journal, article-magazine, article-newspaper, dataset, entry-encyclopedia]:
    - contributor: author
      form: long
      name-order: family-first
    - date: issued
      form: year
    - title: primary
    - title: parent-serial
    - delimiter: ""
      group:
      - number: volume
      - number: issue
        wrap:
          punctuation: parentheses
      - number: pages
        prefix: ":"
    - variable: doi
      prefix: "https://doi.org/"
    - variable: url
    chapter:
    - contributor: author
      form: long
      name-order: family-first
    - date: issued
      form: year
    - title: primary
    - message: pattern.in-container-colon
      args:
        container:
          delimiter: " "
          group:
          - contributor: editor
            form: long
            name-order: family-first
            label: {term: editor, form: long, placement: suffix}
          - title: parent-monograph
      text-case: capitalize-first
    - delimiter: ": "
      group:
      - variable: publisher-place
      - variable: publisher
    - number: pages
      prefix: ". p. "
    - variable: url
    paper-conference:
    - contributor: author
      form: long
      name-order: family-first
    - date: issued
      form: year
    - title: primary
    - title: parent-monograph
    - number: pages
      prefix: ". p. "
    - variable: url
  template:
  - contributor: author
    form: long
    name-order: family-first
  - date: issued
    form: year
  - title: primary
  - delimiter: ": "
    group:
    - variable: publisher-place
    - variable: publisher
  - variable: url
