# yaml-language-server: $schema=https://docs.citum.org/schemas/style.json
info:
  title: Chicago Manual of Style 18th edition — shared component base (hidden)
  description: >-
    Hidden Chicago 18 component base. Carries only the options-level rules
    shared identically by the CMOS author-date and notes heads
    (page- and date-range format, punctuation-in-quote, demote-non-dropping-particle,
    multilingual). Never rendered or discovered directly — both heads
    extend it. Rendered order stays per-style; see csl26-40n4.
options:
  multilingual: romanized-translated
  range-format: chicago16
  dates:
    month: long
    uncertainty-marker: "?]"
    uncertainty-marker-prefix: "["
    approximation-marker: "ca. "
    range-delimiter: "–"
    # citeproc-js leaves publication-year ranges expanded in Chicago 18
    # (page ranges remain independently controlled by range-format).
    range-format: expanded
  punctuation-in-quote: true
  contributors:
    demote-non-dropping-particle: display-and-sort
