info:
  title: Elsevier (author-date/Harvard, with titles)
  fields:
  - biology
  source:
    csl-id: http://www.zotero.org/styles/elsevier-harvard
    adapted-by: citum-migrate
    license: http://creativecommons.org/licenses/by-sa/3.0/
    original-authors:
    - name: David Kaplan
      email: david.kaplan@ird.fr
    links:
    - href: http://www.zotero.org/styles/elsevier-harvard
      rel: self
    - href: http://www.zotero.org/styles/ecology-letters
      rel: template
    - href: http://www.elsevier.com/journals/biological-conservation/0006-3207/guide-for-authors#68000
      rel: documentation
  short-name: "Elsevier Harvard"
options:
  multilingual: romanized-translated
  processing:
    sort:
      template:
      - key: author
      - key: year
    group:
      template: [author, year]
    disambiguate:
      names: false
      add-givenname: true
      year-suffix: true
  substitute:
    contributor-role-form: short
    template:
    - translator
    - title
  contributors:
    display-as-sort: all
    name-form: initials
    initialize-with: .
    delimiter: ", "
    delimiter-precedes-last: always
    demote-non-dropping-particle: never
    sort-separator: ", "
    role:
      omit:
      - editor
  dates: numeric
  punctuation-in-quote: true
  volume-pages-delimiter: { mark: comma }
citation:
  options:
    substitute:
      template:
      - editor
      - translator
      - title
      title-quote: by-category
    # citation-scoped per SUBSTITUTED_VALUE_FORMATTING.md's resolved decision
    # (supporting title config for a by-category substitute flip is
    # citation-scoped by default). Real elsevier-harvard.csl's citation-context
    # substitute macro (author-short) is type-conditional, not the unconditional
    # italic an earlier spec draft wrongly assumed: bill/book/graphic/legal_case/
    # legislation/motion_picture/report/song italicize, everything else quotes.
    # legal-case is excluded here -- it never reaches this substitute tier under
    # this style; its citation.type-variants.legal-case entry above already
    # handles it via a dedicated title-first template. bill is CSL-polymorphic
    # (converts to document/hearing/bill-proceeding/bill-record depending on
    # data shape -- see CSL_TYPE_CONVERSION_CONTRACT.md) and is deliberately not
    # mapped here; it falls through to the quoted default below, a documented
    # divergence from citeproc-js rather than a silent gap.
    titles:
      type-mapping:
        book: monograph
        report: monograph
        graphic: monograph
        motion-picture: monograph
        song: monograph
        statute: monograph
        # thesis defaults to monograph under the engine's hardcoded type-class
        # table, but elsevier-harvard.csl quotes it (not in the italic list) --
        # override explicitly so it doesn't silently inherit an italic it
        # shouldn't have.
        thesis: default
      monograph:
        emph: true
      # component covers article-journal/chapter/entry/entry-dictionary/
      # entry-encyclopedia/paper-conference/post/post-weblog under the engine's
      # hardcoded type-class table; default covers everything else
      # (manuscript, interview, webpage, document, hearing, ...). Both need an
      # explicit quote so those types don't silently render plain under
      # by-category -- see the titles.default coverage gap in the spec.
      component:
        quote: true
      default:
        quote: true
    contributors:
      shorten:
        min: 3
        use-first: 1
  sort: author-date-title
  type-variants:
    legal-case:
    - title: primary
      form: short
      emph: true
      quote: false
    - date: issued
      form: year
    - variable: locator
  template:
  - contributor: author
    form: short
    shorten:
      min: 3
      use-first: 1
      and-others: et-al
      delimiter-precedes-last: contextual
    and: text
  - date: issued
    form: year
  - variable: locator
  wrap:
    punctuation: parentheses
  delimiter: ", "
  multi-cite-delimiter: "; "
  integral:
    delimiter: " "
    type-variants:
      legal-case:
      - title: primary
        form: short
        emph: true
        quote: false
      - group:
        - date: issued
          form: year
        - variable: locator
        delimiter: ", "
        wrap:
          punctuation: parentheses
    template:
    - contributor: author
      form: short
      shorten:
        min: 3
        use-first: 1
        and-others: et-al
        delimiter-precedes-last: contextual
      and: text
    - delimiter: ", "
      wrap:
        punctuation: parentheses
      group:
      - date: issued
        form: year
      - variable: locator
bibliography:
  options:
    substitute:
      template:
      - translator
    hanging-indent: true
    separator: ". "
    entry-suffix: "."
  type-variants:
    [article-journal, article-magazine]:
    - contributor: author
      form: long
      name-order: family-first
    - date: issued
      form: year
      prefix: ", "
      suffix: "."
    - title: primary
      suffix: "."
    - delimiter: " "
      group:
      - title: parent-serial
      - delimiter: ", "
        group:
        - number: volume
        - number: pages
    - variable: doi
      prefix: ". https://doi.org/"
      links:
        target: doi
        anchor: component
    book:
    - contributor: editor
      form: long
      name-order: family-first
      suffix: " (Eds.)"
    - contributor: author
      form: long
      name-order: family-first
    - date: issued
      form: year
      prefix: ", "
      suffix: "."
    - delimiter: ", "
      suffix: "."
      group:
      - title: primary
      - number: edition
        suffix: ". ed."
    - delimiter: ", "
      group:
      - variable: publisher
      - variable: publisher-place
    chapter:
    - contributor: author
      form: long
      name-order: family-first
    - date: issued
      form: year
      prefix: ", "
      suffix: "."
    - title: primary
    - delimiter: " "
      prefix: ", "
      suffix: "."
      group:
      - message: pattern.in-container-colon
        args:
          container:
            group:
              - contributor: editor
                form: long
                name-order: family-first
                suffix: " (Eds.),"
              - title: parent-monograph
            delimiter: " "
    - variable: publisher
      suffix: ","
    - number: pages
      prefix: " "
      label-form: short
    paper-conference:
      add:
        - component:
            title: parent-monograph
            prefix: ', in: '
            suffix: .
          after:
            title: primary
        - component:
            number: pages
            label-form: short
            suffix: .
          after:
            title: parent-monograph
    thesis:
      add:
        - component:
            variable: genre
            wrap:
              punctuation: parentheses
            prefix: ' '
            suffix: .
          after:
            title: primary
        - component:
            variable: publisher
          after:
            variable: genre
    webpage:
    - contributor: author
      form: long
      name-order: family-first
    - date: issued
      form: year
      prefix: ", "
      suffix: "."
    - title: primary
      suffix: " [WWW Document]."
    - variable: url
      prefix: "URL "
      links:
        target: url
        anchor: component
    - message: pattern.accessed-date
      args:
        date:
          date: accessed
          form: full
      wrap:
        punctuation: parentheses
    [article-newspaper, broadcast]:
    - contributor: author
      form: long
      name-order: family-first
    - date: issued
      form: year
      prefix: ", "
      suffix: "."
    - title: primary
      suffix: "."
    - title: parent-serial
      suffix: "."
    entry-encyclopedia:
      modify:
        - match:
            title: primary
          suffix: .
      add:
        - component:
            title: parent-monograph
            suffix: .
          after:
            title: primary
    legal-case:
    - title: primary
    - date: issued
      form: year
      prefix: ", "
      suffix: ". "
    - title: parent-serial
      prefix: ", "
    - variable: reporter
      prefix: ", "
      suffix: "."
    [dataset, motion-picture, interview, personal-communication]:
    - contributor: author
      form: long
      name-order: family-first
    - date: issued
      form: year
      prefix: ", "
      suffix: "."
    - title: primary
      suffix: "."
    patent:
      extends: dataset,motion-picture,interview,personal-communication
      add:
        - component:
            variable: number
            suffix: .
          after:
            title: primary
    report:
    - contributor: author
      form: long
      name-order: family-first
    - date: issued
      form: year
      prefix: ", "
      suffix: "."
    - title: primary
    - variable: genre
      wrap:
        punctuation: parentheses
      prefix: " "
      suffix: "."
    - delimiter: ", "
      group:
      - variable: publisher
      - variable: publisher-place
    entry-dictionary:
    - title: primary
    - date: issued
      form: year
      prefix: ", "
    - title: parent-monograph
    standard:
    - title: primary
    - date: issued
      form: year
      prefix: ", "
    - variable: doi
      prefix: ". https://doi.org/"
  template:
  - contributor: author
    form: long
    name-order: family-first
  - date: issued
    form: year
    prefix: ", "
    suffix: "."
  - title: primary
