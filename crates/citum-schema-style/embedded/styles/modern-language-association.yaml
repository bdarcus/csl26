# yaml-language-server: $schema=https://docs.citum.org/schemas/style.json
info:
  title: Modern Language Association Handbook 9th edition (in-text citations)
  description: MLA source citations, in-text citations system (chapter 6)
  fields:
  - humanities
  - literature
  source:
    csl-id: http://www.zotero.org/styles/modern-language-association
    adapted-by: citum-migrate
    license: http://creativecommons.org/licenses/by-sa/3.0/
    original-authors:
    - name: Sebastian Karcher
      uri: https://orcid.org/0000-0001-8249-7388
    - name: Andrew Dunning
      uri: https://orcid.org/0000-0003-0464-5036
    links:
    - href: http://www.zotero.org/styles/modern-language-association
      rel: self
    - href: https://style.mla.org/
      rel: documentation
  short-name: "MLA"
  edition: "9th"
options:
  # mla.csl (styles-legacy/modern-language-association.csl:1146) joins the
  # locator to the preceding author-short/title with a bare space for
  # page/line locators ("Kuhn 23"), and a comma-joined label for every
  # other kind ("Kuhn, sec. 12"). See docs/specs/LOCATOR_RENDERING.md
  # ("Label Case and Attachment").
  locators:
    preset: note
    kinds:
      page: { attach: " " }
      line: { attach: " " }
  # MLA is author-page, not author-date: it never appends year suffixes. It
  # disambiguates by adding names / given-name initials (matches mla.csl:
  # disambiguate-add-names + disambiguate-add-givenname, no add-year-suffix) and,
  # when those cannot resolve, by the `disambiguate-only` short title in the
  # citation template below. The explicit `bibliography.sort` is unaffected.
  processing:
    disambiguate:
      names: true
      add-givenname: true
      year-suffix: false
  substitute:
    contributor-role-form: long
    candidates: [editor, title, translator]
  integral-name-memory:
    contexts: body-only
    subsequent-form: short
  contributors: chicago
  dates: long
  titles: chicago
  multilingual:
    title-mode: combined
    name-mode: primary
    preferred-script: Latn
  range-format: minimal-two
  punctuation-in-quote: true
citation:
  options:
    contributors:
      shorten:
        min: 3
        use-first: 1
        and-others: et-al
        delimiter-precedes-et-al: never
  template:
  - group:
    - contributor: author
      form: family-only
    - title: primary
      disambiguate-only: true
      wrap:
        punctuation: quotes
      prefix: ", "
  - variable: locator
  integral:
    template:
    - contributor: author
      form: long
      name-order: given-first
    - variable: locator
      wrap:
        punctuation: parentheses
  wrap:
    punctuation: parentheses
  multi-cite-delimiter: "; "
bibliography:
  options:
    contributors:
      display-as-sort: first
      shorten:
        min: 3
        use-first: 1
        and-others: et-al
        delimiter-precedes-last: contextual
      delimiter-precedes-last: always
      delimiter-precedes-et-al: always
      role:
        omit:
        - interviewer
    subsequent-author-substitute: ———
    hanging-indent: true
    entry-suffix: .
    separator: ". "
    entry-suffix-after-url: true
    entry-suffix-after-doi: true
  type-variants:
    article-journal:
      modify:
        - match:
            number: pages
          label-form: short
        - match:
            variable: doi
          prefix: ", https://doi.org/"
    article-magazine:
      modify:
        - match:
            number: pages
          label-form: short
    chapter:
      modify:
        - match:
            number: pages
          label-form: short
    entry-encyclopedia:
      modify:
        - match:
            number: pages
          label-form: short
    paper-conference:
      modify:
        - match:
            number: pages
          label-form: short
    manuscript:
    - contributor: author
      form: long
      name-order: family-first
      shorten:
        min: 3
        use-first: 1
    - title: primary
      quote: true
    - variable: genre
      prefix: ". "
    - date: issued
      form: day-month-abbr-year
      prefix: ". "
    - variable: archive-name
      prefix: ", "
    - variable: archive-location
      prefix: ", "
    personal-communication:
      extends: manuscript
      remove:
        - match:
            variable: archive-location
    entry-dictionary:
    - title: primary
      wrap:
        punctuation: quotes
      text-case: title
    - title: parent-monograph
    - variable: url
      prefix: ", "
    - message: pattern.accessed-date
      args:
        date:
          date: accessed
          form: day-month-abbr-year
      text-case: capitalize-first
      prefix: ". "
    standard:
    - variable: authority
    - title: primary
      text-case: title
    - group:
      - variable: genre
      - number: number
      delimiter: " "
    - variable: publisher
      prefix: ", "
    - date: issued
      form: day-month-abbr-year
      prefix: ", "
    - variable: doi
      prefix: ". https://doi.org/"
    interview:
    - contributor: author
      form: long
      name-order: family-first
      shorten:
        min: 3
        use-first: 1
    - title: primary
      quote: true
      text-case: title
    - contributor: interviewer
      form: long
      name-order: given-first
      prefix: "Interview by "
    - title: parent-monograph
      emph: true
      prefix: ". "
    - date: issued
      form: day-month-abbr-year
    - variable: url
      prefix: ", "
    - variable: medium
    - number: pages
      prefix: ", "
      label-form: short
  template:
  - contributor: author
    form: long
    name-order: family-first
    shorten:
      min: 3
      use-first: 1
  - title: primary
    text-case: title
  - group:
    - group:
      - title: parent-monograph
        emph: true
      - contributor: editor
        form: verb
        name-order: given-first
        shorten:
          min: 4
          use-first: 1
      delimiter: ", "
    - contributor: translator
      form: verb
      name-order: given-first
      text-case: capitalize-first
    - title: parent-serial
      emph: true
    - number: volume
      prefix: "vol. "
    - number: issue
      prefix: "no. "
    - variable: publisher
    - date: issued
      form: day-month-abbr-year
    delimiter: ", "
    prefix: ". "
  - number: pages
    prefix: ", "
  - variable: doi
    prefix: ", "
  - variable: url
  sort: author-title-date
