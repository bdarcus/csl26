# yaml-language-server: $schema=https://docs.citum.org/schemas/style.json
info:
  title: Springer - NLM/Vancouver (citation-sequence, brackets)
  description: Based on the document "Key Style Points 2.0 І December 2024".
  source:
    csl-id: http://www.zotero.org/styles/springer-vancouver-brackets
    adapted-by: citum-migrate
    license: http://creativecommons.org/licenses/by-sa/3.0/
    original-authors:
    - name: Charles Parnot
      email: charles.parnot@gmail.com
      uri: http://twitter.com/cparnot
    links:
    - href: http://www.zotero.org/styles/springer-vancouver-brackets
      rel: self
    - href: http://www.zotero.org/styles/nlm-citation-sequence
      rel: template
    - href: https://www.springer.com/gp/authors-editors/book-authors-editors/your-publication-journey/manuscript-preparation
      rel: documentation
    - href: https://dam.springernature.com/file/1iVex7Gr46Q8xLzdF9RNhT/*/Key+Style+Points_Dec_24.pdf?authcred=Q29weVVSTDpDMHB5X1VSTA==
      rel: documentation
options:
  multilingual: romanized-translated
  substitute: standard
  processing: numeric
  contributors:
    display-as-sort: all
    name-form: initials
    initialize-with: ''
    delimiter: ', '
    delimiter-precedes-last: always
    demote-non-dropping-particle: sort-only
    sort-separator: ' '
  dates: short
  # Not the `scientific` preset: its SentenceNlm case transform sentence-cases
  # component/monograph titles, but the shipped CSL title macro
  # (<text variable="title"/>, no text-case) preserves title case as authored.
  titles:
    component:
      text-case: as-is
    monograph:
      text-case: as-is
  range-format: minimal
  punctuation-in-quote: true

citation:
  options:
    label-mode: numeric
    label-wrap: brackets
  template-ref: numeric-citation
  integral:
    template:
    - contributor: author
      form: short
      shorten:
        min: 3
        use-first: 1
        and-others: et-al
        delimiter-precedes-last: contextual
      and: text
    delimiter: " "
  multi-cite-delimiter: ","
  delimiter: ""

bibliography:
  options:
    entry-suffix: .
    separator: '. '
  type-variants:
    article-journal:
    - contributor: author
      form: long
      shorten:
        min: 7
        use-first: 6
        and-others: et-al
        delimiter-precedes-last: always
    - title: primary
    - title: parent-serial
    - group:
      - variable: publisher-place
        suffix: ': '
      - variable: publisher
        suffix: '; '
      - date: issued
        form: year
        suffix: ';'
      - number: volume
      - number: pages
        prefix: ':'
      delimiter: ''
    - variable: doi
      prefix: '. https://doi.org/'

    chapter:
    - contributor: author
      form: long
    - title: primary
    - message: pattern.in-container-colon
      args:
        container:
          group:
            - contributor: editor
              form: long
              label: {term: editor, form: long, placement: suffix}
            - title: parent-monograph
          delimiter: '. '
          prefix: ' '
      text-case: capitalize-first
    - variable: publisher
      suffix: '; '
    - date: issued
      form: year
    - number: pages
      prefix: '. p. '

    book:
    - contributor: author
      form: long
    - contributor: editor
      form: long
      label: {term: editor, form: long, placement: suffix}
    - title: primary
    - number: edition
    - variable: publisher-place
      suffix: ': '
    - variable: publisher
      suffix: '; '
    - date: issued
      form: year

    thesis:
    - contributor: author
      form: long
    - group:
      - title: primary
      - variable: genre
        wrap:
          punctuation: brackets
      delimiter: ' '
    - variable: publisher
      suffix: '; '
    - date: issued
      form: year

    paper-conference:
    - contributor: author
      form: long
    - title: primary
    - title: parent-monograph
    - date: issued
      form: year
    - number: pages
      prefix: 'p. '

    webpage:
    - contributor: author
      form: long
    - title: primary
    - date: issued
      form: year
    - message: pattern.cited-date
      args:
        date:
          date: accessed
          form: year-month-day
      wrap:
        punctuation: brackets
    - variable: url
    - message: pattern.accessed-date
      args:
        date:
          date: accessed
          form: year-month-day

    article-newspaper:
    - contributor: author
      form: long
    - title: primary
    - title: parent-serial
    - group:
      - date: issued
        form: year
      - date: issued
        form: month-day
        prefix: ' '
      delimiter: ''
      suffix: ';'

    article-magazine:
    - contributor: author
      form: long
    - title: primary
    - title: parent-serial
    - group:
      - date: issued
        form: year
        suffix: ' '
      - date: issued
        form: month-day
        suffix: ';'
      - number: volume
      - number: pages
        prefix: ':'
      delimiter: ''

    entry-encyclopedia:
    - contributor: author
      form: long
    - title: primary
    - title: parent-serial
    - variable: publisher
      suffix: '; '
    - date: issued
      form: year
    - number: pages
      prefix: '. p. '

    entry-dictionary:
    - title: primary
    - title: parent-monograph
    - message: pattern.cited-date
      args:
        date:
          date: accessed
          form: year-month-day
      wrap:
        punctuation: brackets
    - variable: url
    - message: pattern.accessed-date
      args:
        date:
          date: accessed
          form: day-month-abbr-year

    dataset:
      extends: webpage
      add:
        - component:
            variable: publisher
            suffix: '; '
          before:
            date: issued
    legal-case:
    - title: primary
    - variable: reporter
    - date: issued
      form: year
    - number: pages
      prefix: '. p. '

    interview:
    - contributor: author
      form: long
    - title: primary
    - date: issued
      form: year
    - variable: url

    report:
    - contributor: author
      form: long
    - title: primary
    - contributor: editor
      form: long
      label: {term: editor, form: long, placement: suffix}
    - variable: publisher-place
      suffix: ': '
    - variable: publisher
      suffix: '; '
    - date: issued
      form: year

    map:
    - contributor: author
      form: long
    - title: primary
    - variable: publisher
      suffix: '; '
    - date: issued
      form: year
    - message: pattern.cited-date
      args:
        date:
          date: accessed
          form: year-month-day
      wrap:
        punctuation: brackets
    - variable: url
    - message: pattern.accessed-date
      args:
        date:
          date: accessed
          form: day-month-abbr-year

    software:
    - contributor: author
      form: long
    - title: primary
    - date: issued
      form: year
    - variable: url

    hearing:
    - title: primary
    - number: number
    - date: issued
      form: year
    - variable: url

    standard:
    - title: primary
    - variable: publisher-place
      suffix: ': '
    - variable: publisher
      suffix: '; '
    - date: issued
      form: year
    - message: pattern.cited-date
      args:
        date:
          date: accessed
          form: year-month-day
      wrap:
        punctuation: brackets
    - variable: doi
      prefix: https://doi.org/

    statute:
    - title: primary
    - variable: code
    - variable: section
      prefix: 'Sect. '
    - date: issued
      form: year
    - variable: url

    regulation:
    - title: primary
    - variable: code
    - date: issued
      form: year
    - variable: url


  template:
  - contributor: author
    form: long
  - title: primary
  - title: parent-serial
  - variable: publisher-place
    suffix: ': '
  - variable: publisher
    suffix: '; '
  - date: issued
    form: year
  - number: volume
    prefix: ';'
  - number: pages
    prefix: ':'
  - variable: doi
    prefix: '. https://doi.org/'
