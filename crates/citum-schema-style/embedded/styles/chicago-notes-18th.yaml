extends: chicago-18-base
info:
  title: Chicago Manual of Style 18th edition (notes without bibliography)
  description: Chicago-style source citations (with Bluebook for legal citations), notes system
    without bibliography, listing up to six authors in a full citation (CMOS18 13.23), displaying
    number of volumes (CMOS18 14.20)
  fields:
  - anthropology
  - communications
  - geography
  - history
  - humanities
  - law
  - linguistics
  - literature
  - philosophy
  - science
  - sociology
  - theology
  source:
    csl-id: http://www.zotero.org/styles/chicago-notes
    adapted-by: citum-migrate
    license: http://creativecommons.org/licenses/by-sa/3.0/
    original-authors:
    - name: Andrew Dunning
      uri: https://orcid.org/0000-0003-0464-5036
    links:
    - href: http://www.zotero.org/styles/chicago-notes
      rel: self
    - href: http://www.zotero.org/styles/chicago-notes-bibliography
      rel: template
    - href: https://www.chicagomanualofstyle.org/
      rel: documentation
  short-name: "Chicago Notes"
  edition: "18th edition"
options:
  messages:
    pattern.chicago-episode: "episode {$number}"
    pattern.chicago-of-number: "of {$number}"
  date-fallback: standard
  # multilingual, page-range-format, dates, punctuation-in-quote, and
  # contributors.demote-non-dropping-particle are inherited from chicago-18-base.
  processing: note
  substitute: editor-translator-short
  contributors:
    and: text
    delimiter-precedes-last: contextual
  titles:
    # CMOS 18 title-cases nearly every reference-type title; the shared
    # `chicago` TitlePreset (crates/citum-schema-style/src/presets.rs)
    # supplies quote/emph but no text-case -- MLA also uses that preset, so
    # the case fix is applied here explicitly per-style rather than by
    # changing the shared preset. `quote: true` on component is preserved
    # from the preset (load-bearing here: unlike chicago-author-date-18th,
    # whose quoting comes from `wrap: punctuation: quotes` on its own
    # default bibliography template, this style's citation-form title
    # quoting has no such template-level source and depends entirely on
    # this category-level flag -- confirmed by testing, which showed
    # dropping it strips quotes from every component-category citation).
    # See docs/architecture/audits/2026-08-23_CHICAGO_PARITY_LEVERAGE_AUDIT.md,
    # wave 1.
    #
    # Deliberately narrower than chicago-author-date-18th's type-mapping:
    # broadcast/collection/manuscript/motion-picture/song/webpage are NOT
    # added here. Testing showed routing them into `component` also pulls
    # in this same `quote: true`, which the oracle does not want on bare
    # archival/manuscript titles ("Revere Family Papers", "Landscapes of
    # Zambia, Central Africa") -- a real regression, not a wash. Only
    # map/dataset are added here, matching what's proven safe; the rest is
    # deferred to wave 2 (csl26-jxco, title quote boundary), which must land
    # per-type with verification, not as a bulk copy of author-date-18th's
    # list.
    type-mapping:
      # `map`/`graphic` route to `monograph` (title-case + emph, no quote),
      # not `component`: the shipped chicago-author-date.csl's title
      # choose-block puts `book classic graphic hearing map` in the
      # never-quote, always-italic set. `map` was originally added as
      # `component` (wave 1, csl26-4xr6) for its title-case fix alone,
      # which also pulled in `component`'s `quote: true` -- wrong for map,
      # caught here in wave 3 (csl26-vmw3) once quoting was checked
      # per-type against the real .csl rather than assumed safe by
      # analogy to dataset/document.
      map: monograph
      graphic: monograph
      # `classic`/`hearing` share the exact same choose-block bucket as
      # map/graphic above (never-quote, always-italic) -- added together
      # with them once confirmed to apply identically. See
      # docs/architecture/audits/2026-08-23_CHICAGO_PARITY_LEVERAGE_AUDIT.md
      # wave 3, csl26-vmw3.
      classic: monograph
      hearing: monograph
      dataset: component
      # `document` and `thesis` per docs/architecture/audits/2026-08-23_
      # CHICAGO_PARITY_LEVERAGE_AUDIT.md wave 2 (csl26-jxco): the shipped
      # chicago-author-date.csl's title choose-block quotes+title-cases both
      # (`article dataset document interview manuscript paper-conference
      # personal_communication speech thesis webpage`); the engine's hardcoded
      # type->category fallback has neither (document falls to Default;
      # thesis is hardcoded to Monograph/italic, which is wrong for Chicago).
      document: component
      thesis: component
    component:
      quote: true
      text-case: title
    monograph:
      text-case: title
      emph: true
    container-monograph:
      text-case: title
      emph: true
    periodical:
      emph: true
    serial:
      emph: true
