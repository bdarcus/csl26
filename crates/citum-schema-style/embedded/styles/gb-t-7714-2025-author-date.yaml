# yaml-language-server: $schema=https://docs.citum.org/schemas/style.json
extends: gb-t-7714-2025-base
version: 0.71.0
info:
  title: GB/T 7714—2025（著者-出版年，双语）
  id: https://zotero-chinese.com/styles/GB-T-7714—2025（著者-出版年，双语）
  description: GB/T 7714—2025 信息与文献 参考文献著录规则（2026-07-01实施）
  default-locale: zh-CN
  source:
    csl-id: https://zotero-chinese.com/styles/GB-T-7714—2025（著者-出版年，双语）
    adapted-by: citum-migrate
    license: http://creativecommons.org/licenses/by-sa/3.0/
    original-authors:
    - name: Zeping Lee
      email: zepinglee@gmail.com
    links:
    - href: https://zotero-chinese.com/styles/GB-T-7714—2025（著者-出版年，双语）
      rel: self
    - href: https://zotero-chinese.com/styles/GB-T-7714—2025（顺序编码，双语）
      rel: template
    - href: https://std.samr.gov.cn/gb/search/gbDetailed?id=4507EFE13D37CB6AE06397BE0A0A601F
      rel: documentation
options:
  date-fallback: gb-t-7714-2025-author-date
  # GB/T 7714's anonymous-author placeholder (`佚名`/`Anon`) is sourced
  # from each locale file's `messages.term.anonymous`
  # (zh-CN.yaml/en-US.yaml) — not a style-owned override — so the same
  # `bibliography: locales:` per-item branch selection that already picks
  # `term.no-date`'s locale (`n.d.` vs `无日期`) also picks the correct
  # anonymous term. csl26-6eak.
  substitute:
    candidates: [editor, title, translator]
    otherwise:
      message: term.anonymous
      form: short
  processing: author-date-givenname
  contributors:
    initialize-with: ' '
    shorten:
      min: 4
      use-first: 3
      and-others: et-al
      delimiter-precedes-last: contextual
    delimiter: { mark: comma }
    demote-non-dropping-particle: never
    name-form: initials
  range-format: expanded
citation:
  # source (tests/fixtures/csl-m/gb-t-7714-2025-author-date.csl):
  # collapse="year" — SAME_AUTHOR_COLLAPSE.md §7
  collapse:
    same-author: {}
  options:
    contributors:
      shorten:
        min: 2
        use-first: 1
        and-others: et-al
        delimiter-precedes-last: contextual
      delimiter: { mark: comma }
      and: text
  template:
  - contributor: author
    form: long
  - date: issued
    form: year
  locales:
  - locale:
    - en
    template:
    - contributor: author
      form: short
      shorten:
        min: 2
        use-first: 1
        and-others: et-al
        delimiter-precedes-last: contextual
      and: text
    - date: issued
      form: year
  - default: true
    template:
    - contributor: author
      form: long
      shorten:
        min: 2
        use-first: 1
        and-others: et-al
        delimiter-precedes-last: contextual
      and: text
    - date: issued
      form: year
  wrap: parentheses
  delimiter: { mark: comma }
  multi-cite-delimiter: { mark: semicolon }
bibliography:
  options:
    # Author-date entries carry no reference marker; this cancels the numeric
    # one declared on gb-t-7714-2025-base for its numeric and note leaves.
    # See docs/specs/REFERENCE_MARKERS.md.
    label-mode: author-date
    # GB/T 7714 author-date has no title-as-author substitution convention:
    # an item with no author (and no editor/translator to promote) renders
    # the locale's 佚名 (anonymous-author) term via `substitute.otherwise`
    # (csl26-6eak), not a promoted title.
    # The inherited global `options.substitute: standard` preset (editor →
    # title → translator) would otherwise win via `title` first — nearly
    # every reference has *some* title, so `otherwise` would never be reached.
    # This scope drops `title` while retaining editor/translator promotion.
    # Scoped to bibliography only; citations keep the inherited preset
    # unchanged (not re-verified against this bean's corpus work).
    substitute:
      candidates:
      - editor
      - translator
    contributors:
      shorten:
        min: 4
        use-first: 3
        and-others: et-al
        delimiter-precedes-last: contextual
      delimiter: null
    hanging-indent: true
    separator: ''
  template:
  - group:
    - number: volume
    - number: issue
      wrap:
        punctuation: parentheses
    delimiter: ' '
  - contributor: author
    form: long
    and: none
  - date: issued
    form: year
  - variable: archive-location
    suppress: true
  - title: container-title
    suppress: true
    strip-periods: true
  - contributor: container-author
    form: long
    suppress: true
  - variable: archive
    suppress: true
  - title: primary
  - number: number
  - group:
    - variable: medium
    delimiter: '/'
    wrap:
      punctuation: brackets
  - number: pages
  - variable: publisher
  - variable: publisher-place
  - variable: version
    strip-periods: true
  - contributor: translator
    form: long
  - group:
    - number: edition
    delimiter: ' '
  - identifier: cstr
    prefix: 'CSTR:'
  - variable: doi
    prefix: 'DOI:'
  locales:
  - locale:
    - en
    template:
    - group:
      - number: volume
      - number: issue
        wrap:
          punctuation: parentheses
      delimiter: ' '
    - contributor: author
