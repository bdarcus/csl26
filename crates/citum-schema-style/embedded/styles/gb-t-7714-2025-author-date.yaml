      suppress: false
    - identifier: cstr
      prefix: 'CSTR:'
    - group:
      - date: accessed
        form: year
        wrap:
          punctuation: brackets
      wrap:
        punctuation: brackets
      suppress: false
    - variable: url
      suppress: false
    - variable: doi
      prefix: 'DOI:'
      suppress: false
  - default: true
