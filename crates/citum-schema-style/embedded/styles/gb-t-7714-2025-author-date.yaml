      wrap: parentheses
    - date: accessed
      form: year-month-day
      wrap:
        punctuation: brackets
      suffix: '. '
    - variable: url
    - identifier: cstr
      prefix: '. CSTR:'
    - variable: doi
      prefix: '. DOI:'
    article-journal,article-magazine:
    - contributor: author
      form: long
      name-order: family-first
      delimiter: { mark: comma }
      sort-separator: ' '
      suffix: { mark: comma }
    - date: issued
      form: year
      suffix: '. '
      # The author-date preset intentionally renders no date text for an
      # undated article-journal/article-magazine — not 无日期/n.d. like most
      # other type-variants. This matches the shipped upstream CSL: its
      # `date-intext` macro's `type="article-journal article-magazine"`
      # branch is fully self-contained — none of its three inner sub-cases
      # (volume/issue present, available-date present, plain else) ever
      # falls through to the outer no-date-term branch, because CSL/CSL-M
      # `<choose>` selects one top-level branch and never continues past it.
      # Whether GB/T the *standard* (not just this one implementation)
      # actually intends blank-vs-n.d. for undated articles isn't derivable
