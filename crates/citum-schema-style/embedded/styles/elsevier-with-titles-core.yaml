# yaml-language-server: $schema=https://docs.citum.org/schemas/style.json
info:
  title: Elsevier (numeric, with titles)
  description: A style for many of Elsevier's journals that includes article titles in the reference list
  source:
    csl-id: http://www.zotero.org/styles/elsevier-with-titles
    adapted-by: citum-migrate
    license: http://creativecommons.org/licenses/by-sa/3.0/
    original-authors:
    - name: Richard Karnesky
      email: karnesky+zotero@gmail.com
      uri: http://arc.nucapt.northwestern.edu/Richard_Karnesky
    links:
    - href: http://www.zotero.org/styles/elsevier-with-titles
      rel: self
    - href: http://www.zotero.org/styles/elsevier-without-titles
      rel: template
    - href: http://www.elsevier.com/journals/journal-of-hazardous-materials/0304-3894/guide-for-authors#68001
      rel: documentation
options:
  date-fallback: standard
  multilingual: romanized-translated
  substitute:
    contributor-role-form: short
    candidates:
    - editor
    - translator
  processing: numeric
  contributors: numeric-given-dot
  dates: long
  titles:
    component:
      text-case: as-is
    monograph:
      text-case: as-is
    container-monograph:
      text-case: as-is
    periodical: plain
    serial:
      text-case: as-is
  punctuation-in-quote: true
citation:
  template-ref: numeric-citation
  wrap:
    punctuation: brackets
  multi-cite-delimiter: ','
  collapse: citation-number
bibliography:
  options:
    contributors:
      shorten:
        min: 99
        use-first: 99
    entry-suffix: .
    separator: ""
    # Every entry leads with its reference marker, flush against the body.
    # See docs/specs/REFERENCE_MARKERS.md.
    label-mode: numeric
    label-wrap: brackets
  type-variants:
    # Types with no entry here render the section `template:` below, which is
    # the style's only wildcard. Journal articles place the year in parentheses
    # between volume and pages (`Nature 521 (2015) 436–444`) per the Elsevier
    # with-titles guide.
    article-journal:
    - delimiter: { mark: comma }
      group:
      - contributor: author
        form: long
      - title: primary
      - message: pattern.in-container-colon
        args:
          container:
            delimiter: { mark: comma }
            group:
            - title: parent-monograph
            - delimiter: " "
              group:
              - title: parent-serial
              - number: volume
              - date: issued
                form: year
                wrap:
                  punctuation: parentheses
              - number: pages
      - number: edition
      - variable: publisher
      - variable: publisher-place
      - variable: url
        links:
          target: url
          anchor: component
      - message: pattern.accessed-date
        args:
          date:
            group:
              - date: accessed
                form: month-day
              - date: accessed
                form: year
                prefix: ", "
            delimiter: " "
        wrap:
          punctuation: parentheses
      - variable: number
      - variable: doi
        prefix: ". https://doi.org/"
        links:
          target: doi
          anchor: component
        suffix: "."
    article-magazine:
    - delimiter: { mark: comma }
      group:
      - contributor: author
        form: long
      - title: primary
      - delimiter: { mark: comma }
        group:
        - delimiter: ": "
          group:
          - message: pattern.in-container
            args:
              container:
                contributor: editor
                form: long
                label:
                  term: editor
                  form: short
                  placement: suffix
                  prefix: " ("
                  suffix: ")"
                  text-case: capitalize-first
        - title: parent-monograph
        - delimiter: " "
          group:
          - title: parent-serial
          - number: volume
          - date: issued
            form: year
            wrap:
              punctuation: parentheses
          - number: pages
      - number: edition
      - variable: publisher
      - variable: publisher-place
      - variable: url
        links:
          target: url
          anchor: component
      - message: pattern.accessed-date
        args:
          date:
            group:
              - date: accessed
                form: month-day
              - date: accessed
                form: year
                prefix: ", "
            delimiter: " "
        wrap:
          punctuation: parentheses
      - variable: number
      - variable: doi
        prefix: ". https://doi.org/"
        links:
          target: doi
          anchor: component
        suffix: "."
    article-newspaper:
    - delimiter: { mark: comma }
      group:
      - contributor: author
        form: long
      - title: primary
      - delimiter: { mark: comma }
        group:
        - delimiter: ": "
          group:
          - message: pattern.in-container
            args:
              container:
                contributor: editor
                form: long
                label:
                  term: editor
                  form: short
                  placement: suffix
                  prefix: " ("
                  suffix: ")"
                  text-case: capitalize-first
        - title: parent-monograph
        - delimiter: " "
          group:
          - title: parent-serial
          - number: volume
          - number: pages
      - number: edition
      - variable: publisher
      - variable: publisher-place
      - date: issued
        form: year
        wrap:
          punctuation: parentheses
      - variable: url
        links:
          target: url
          anchor: component
      - message: pattern.accessed-date
        args:
          date:
            group:
              - date: accessed
                form: month-day
              - date: accessed
                form: year
                prefix: ", "
            delimiter: " "
        wrap:
          punctuation: parentheses
      - variable: number
      - variable: doi
        prefix: ". https://doi.org/"
        links:
          target: doi
          anchor: component
        suffix: "."
    book:
    - delimiter: { mark: comma }
      group:
      - contributor: author
        form: long
      - title: primary
      - message: pattern.in-container-colon
        args:
          container:
            delimiter: { mark: comma }
            group:
            - title: parent-monograph
            - delimiter: " "
              group:
              - title: parent-serial
              - number: volume
      - number: edition
      - variable: publisher
      - variable: publisher-place
      - date: issued
        form: year
      - variable: url
        links:
          target: url
          anchor: component
      - message: pattern.accessed-date
        args:
          date:
            group:
              - date: accessed
                form: month-day
              - date: accessed
                form: year
                prefix: ", "
            delimiter: " "
        wrap:
          punctuation: parentheses
      - variable: number
      - variable: doi
        prefix: ". https://doi.org/"
        links:
          target: doi
          anchor: component
        suffix: "."
    chapter:
    - contributor: author
      form: long
      suffix: ", "
    - title: primary
    - delimiter: " "
      prefix: ", "
      group:
      - message: pattern.in-container-colon
        args:
          container:
            group:
              - contributor: editor
                form: long
                suffix: ", "
                label:
                  term: editor
                  form: short
                  placement: suffix
                  prefix: " ("
                  suffix: ")"
                  text-case: capitalize-first
              - title: parent-monograph
            delimiter: " "
    - variable: publisher
      prefix: ", "
    - delimiter: ""
      prefix: ", "
      suffix: "."
      group:
      - date: issued
        form: year
        suffix: ":"
      - number: pages
        prefix: " "
        label-form: short
    dataset:
    - delimiter: { mark: comma }
      group:
      - contributor: author
        form: long
      - title: primary
      - delimiter: { mark: comma }
        group:
        - delimiter: ": "
          group:
          - message: pattern.in-container
            args:
              container:
                contributor: editor
                form: long
                label:
                  term: editor
                  form: short
                  placement: suffix
                  prefix: " ("
                  suffix: ")"
                  text-case: capitalize-first
        - title: parent-monograph
        - delimiter: " "
          group:
          - title: parent-serial
          - number: volume
          - number: pages
      - number: edition
      - variable: publisher
      - variable: publisher-place
      - date: issued
        form: year
        wrap:
          punctuation: parentheses
      - variable: url
        links:
          target: url
          anchor: component
        prefix: ". "
      - message: pattern.accessed-date
        args:
          date:
            group:
              - date: accessed
                form: month-day
              - date: accessed
                form: year
                prefix: ", "
            delimiter: " "
        wrap:
          punctuation: parentheses
      - variable: number
      - variable: doi
        prefix: ". https://doi.org/"
        links:
          target: doi
          anchor: component
        suffix: "."
    interview:
    - contributor: author
      form: long
      suffix: ", "
    - title: primary
    - date: issued
      form: year
      wrap:
        punctuation: parentheses
      prefix: ", "
      suffix: "."
    - variable: url
      prefix: " "
      links:
        target: url
        anchor: component
      suffix: "."
    legal-case:
    - title: primary
    - date: issued
      form: year
      prefix: ", "
      suffix: "."
    paper-conference:
    - contributor: author
      form: long
      suffix: ", "
    - title: primary
    - title: parent-monograph
      prefix: ", in: "
    - delimiter: ""
      prefix: ", "
      suffix: "."
      group:
      - date: issued
        form: year
        suffix: ":"
      - number: pages
        prefix: " "
        label-form: short
    patent:
      extends: legal-case
      add:
        - component:
            contributor: author
            form: long
            suffix: ', '
          before:
            title: primary
        - component:
            variable: number
            prefix: ', '
          before:
            date: issued
    report:
    - contributor: author
      form: long
      suffix: ", "
    - title: primary
    - variable: publisher
      prefix: ", "
    - variable: publisher-place
      prefix: ", "
    - date: issued
      form: year
      prefix: ", "
      suffix: "."
    thesis:
      extends: report
      remove:
        - match:
            variable: publisher-place
      add:
        - component:
            variable: genre
            prefix: ', '
          before:
            variable: publisher
    webpage:
    - delimiter: { mark: comma }
      group:
      - contributor: author
        form: long
      - title: primary
      - delimiter: { mark: comma }
        group:
        - delimiter: ": "
          group:
          - message: pattern.in-container
            args:
              container:
                contributor: editor
                form: long
                label:
                  term: editor
                  form: short
                  placement: suffix
                  prefix: " ("
                  suffix: ")"
                  text-case: capitalize-first
        - title: parent-monograph
        - delimiter: " "
          group:
          - title: parent-serial
          - number: volume
          - number: pages
      - number: edition
      - variable: publisher
      - variable: publisher-place
      - date: issued
        form: year
        wrap:
          punctuation: parentheses
      - variable: url
        links:
          target: url
          anchor: component
        prefix: ". "
      - message: pattern.accessed-date
        args:
          date:
            group:
              - date: accessed
                form: month-day
              - date: accessed
                form: year
                prefix: ", "
            delimiter: " "
        wrap:
          punctuation: parentheses
      - variable: number
      - variable: doi
        prefix: ". https://doi.org/"
        links:
          target: doi
          anchor: component
        suffix: "."
    [webpage, dataset]:
    - contributor: author
      form: long
      suffix: ", "
    - title: primary
    - date: issued
      form: year
      wrap:
        punctuation: parentheses
      prefix: ", "
      suffix: "."
    - variable: url
      prefix: " "
      links:
        target: url
        anchor: component
    - message: pattern.accessed-date
      args:
        date:
          group:
            - date: accessed
              form: month-day
            - date: accessed
              form: year
              prefix: ", "
          delimiter: " "
      wrap:
        punctuation: parentheses
    [article-newspaper, broadcast]:
    - contributor: author
      form: long
      suffix: ", "
    - title: primary
    - title: parent-serial
      prefix: ", "
    - date: issued
      form: year
      wrap:
        punctuation: parentheses
      prefix: " "
      suffix: "."
    motion-picture:
      extends: legal-case
      add:
        - component:
            contributor: author
            form: long
            suffix: ', '
          before:
            title: primary
    personal-communication:
      extends: interview
      remove:
        - match:
            variable: url
  template:
  - delimiter: { mark: comma }
    group:
    - contributor: author
      form: long
    - title: primary
    - delimiter: { mark: comma }
      group:
      - delimiter: ": "
        group:
        - message: pattern.in-container
          args:
            container:
              contributor: editor
              form: long
              label:
                term: editor
                form: short
                placement: suffix
                prefix: " ("
                suffix: ")"
                text-case: capitalize-first
      - title: parent-monograph
      - delimiter: " "
        group:
        - title: parent-serial
        - number: volume
        - number: pages
    - number: edition
    - variable: publisher
    - variable: publisher-place
    - date: issued
      form: year
    - variable: url
      links:
        target: url
        anchor: component
    - message: pattern.accessed-date
      args:
        date:
          group:
            - date: accessed
              form: month-day
            - date: accessed
              form: year
              prefix: ", "
          delimiter: " "
      wrap:
        punctuation: parentheses
    - variable: number
    - variable: doi
      prefix: ". https://doi.org/"
      links:
        target: doi
        anchor: component
      suffix: "."
