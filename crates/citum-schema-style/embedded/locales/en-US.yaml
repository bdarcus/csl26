messages:
  number.ordinal: |
    .match {$count :ordinal}
    when one {{$value}st}
    when two {{$value}nd}
    when few {{$value}rd}
    when * {{$value}th}
  # Locator labels
  term.page-label: |
    .match {$count :plural}
    when one {p.}
    when * {pp.}
  term.page-label-long: |
    .match {$count :plural}
    when one {page}
    when * {pages}
  term.chapter-label: |
    .match {$count :plural}
    when one {chap.}
    when * {chaps.}
  term.volume-label: |
    .match {$count :plural}
    when one {vol.}
    when * {vols.}
  term.section-label: |
    .match {$count :plural}
    when one {sec.}
    when * {secs.}
  term.figure-label: |
    .match {$count :plural}
    when one {fig.}
    when * {figs.}
  term.track-label-long: |
    .match {$count :plural}
    when one {track}
    when * {tracks}
  # Conjunctions and connectors
  term.and: "and"
  term.and-symbol: "&"
  term.role-conjunction: " & "
  term.et-al: "et al."
  term.and-others: "and others"
  # Date and access terms
  term.accessed: "accessed"
  term.retrieved: "retrieved"
  term.no-date: "n.d."
  term.no-date-long: "no date"
  # GB/T 7714's own anonymous-author convention (not the CSL legacy
  # `terms.anonymous` "anon." catalog entry) — see csl26-6eak.
  term.anonymous: "Anon"
  term.anonymous-long: "Anonymous"
  term.forthcoming: "forthcoming"
  # CSL reference locale (scripts/locales-en-US.xml): CMOS 10.48 allows
  # "ca." but CSL has historically used "c." — match the CSL reference.
  term.circa: "c."
  term.circa-long: "circa"
  # Role labels
  role.editor.label: |
    .match {$count :plural}
    when one {ed.}
    when * {eds.}
  role.editor.label-long: |
    .match {$count :plural}
    when one {editor}
    when * {editors}
  role.editor.verb: "edited by"
  # CSL reference (scripts/locales-en-US.xml) distinguishes "ed. by" (short) from "edited by" (long).
  role.editor.verb-short: "ed. by"
  role.translator.label: "trans."
  role.translator.label-long: |
    .match {$count :plural}
    when one {translator}
    when * {translators}
  role.translator.verb: "translated by"
  # CSL reference (scripts/locales-en-US.xml) distinguishes "trans. by" (short) from "translated by" (long).
  role.translator.verb-short: "trans. by"
  role.guest.label: |
    .match {$count :plural}
    when one {guest}
    when * {guests}
  role.guest.label-long: |
    .match {$count :plural}
    when one {guest}
    when * {guests}
  role.guest.verb: |
    .match {$count :plural}
    when one {with guest}
    when * {with guests}
  # Archive hierarchy labels
  term.archive-collection-label: "collection"
  term.archive-series-label: "series"
  term.archive-box-label: |
    .match {$count :plural}
    when one {box}
    when * {boxes}
  term.archive-folder-label: |
    .match {$count :plural}
    when one {folder}
    when * {folders}
  term.archive-item-label: |
    .match {$count :plural}
    when one {item}
    when * {items}
  # Compositional patterns
  pattern.accessed-date: "accessed {$date}"
  pattern.accessed-date-colon: "accessed: {$date}"
  pattern.in-container: "in {$container}"
  pattern.in-container-colon: "in: {$container}"
  pattern.originally-published-as: "originally published as {$title}"
  pattern.cited-date: "cited {$date}"
  pattern.issued-date: "issued {$date}"
  pattern.retrieved-date: "retrieved {$date}"
  pattern.published-online: "Published online"
  pattern.published-online-date: "Published online {$date}"
  pattern.patent-number: "Patent {$number}"
  pattern.locator-at: "at {$locator}"
  pattern.retrieved-from: "retrieved from {$url}"
  pattern.available-at: "available at {$url}"
  pattern.chicago-aired-date: "aired {$date}"
  pattern.chicago-by: "by {$name}"
  pattern.chicago-interview-by: "interview by {$name}"
  pattern.chicago-on: "on {$source}"
  pattern.chicago-review-of: "review of {$genre}"
  pattern.chicago-to: "to {$name}"
  pattern.chicago-with: "with {$name}"
  pattern.chicago-written-by: "written by {$name}"
  pattern.chicago-recorded-date: "recorded {$date}"
  pattern.chicago-released-date: "released {$date}"
  date.open-ended: "present"

date-formats:
  numeric-short: "M/d/yyyy"
  textual-long: "MMMM yyyy"
  textual-full: "MMMM d, yyyy"
  bib-default: "MMMM d, yyyy"
  year-only: "yyyy"
  iso: "yyyy-MM-dd"

number-formats:
  decimal-separator: "."
  thousands-separator: ","
  minimum-digits: 1

grammar-options:
  punctuation-in-quote: true
  nbsp-before-colon: false
  open-quote: “
  close-quote: ”
  open-inner-quote: "‘"
  close-inner-quote: "’"
  serial-comma: true
  page-range-delimiter: "–"
  title-subtitle-delimiter: ": "
  subtitle-delimiter: "; "
  strong-terminal-comma-policy: keep-both
  delimiter-suppressing-terminal-marks: "?!…"
  note-punctuation: inside
