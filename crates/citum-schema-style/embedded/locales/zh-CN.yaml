locale-schema-version: "2"
locale: zh-CN

# EXPERT REVIEW NEEDED: grammar-options and date-formats below were authored
# from documented GB/T 7714 typography conventions, not by a native speaker
# or professional translator. Please have a Chinese-language editor verify
# quote characters, delimiters, and date-pattern assembly before relying on
# this locale for publication-grade output.

evaluation:
  message-syntax: mf2

dates:
  months:
    long:
      - 一月
      - 二月
      - 三月
      - 四月
      - 五月
      - 六月
      - 七月
      - 八月
      - 九月
      - 十月
      - 十一月
      - 十二月
    short:
      - 1月
      - 2月
      - 3月
      - 4月
      - 5月
      - 6月
      - 7月
      - 8月
      - 9月
      - 10月
      - 11月
      - 12月
  seasons:
    - 春
    - 夏
    - 秋
    - 冬

locators:
  page:
    long:
      singular: 页
      plural: 页
    short:
      singular: 页
      plural: 页
  chapter:
    long:
      singular: 章
      plural: 章
    short:
      singular: 章
      plural: 章
  section:
    long:
      singular: 节
      plural: 节
    short:
      singular: 节
      plural: 节
  volume:
    long:
      singular: 卷
      plural: 卷
    short:
      singular: 卷
      plural: 卷

roles:
  # English fallback: BibLaTeX does not ship authoritative Chinese forms.
  annotator:
    long:
      singular: annotator
      plural: annotators
    short: annot.
    verb: annotated by
    verb-short: annot. by
  commentator:
    long:
      singular: commentator
      plural: commentators
    short: comm.
    verb: commented by
    verb-short: comm. by
  foreword-author:
    long:
      singular: foreword
      plural: foreword
    short: forew.
    verb: with a foreword by
    verb-short: with a forew. by
  introduction-author:
    long:
      singular: introduction
      plural: introduction
    short: intro.
    verb: with an introduction by
    verb-short: with an intro. by
  afterword-author:
    long:
      singular: afterword
      plural: afterword
    short: afterw.
    verb: with an afterword by
    verb-short: with an afterw. by
  editor:
    long:
      singular: 编辑
      plural: 编辑
    short:
      singular: 编
      plural: 编
    verb: 编辑
  editorial-director:
    long:
      singular: 主编
      plural: 主编
    short:
      singular: 主编
      plural: 主编
    verb: 主编
  translator:
    long:
      singular: 翻译
      plural: 翻译
    short:
      singular: 译
      plural: 译
    verb: 翻译
  illustrator:
    long:
      singular: 绘图
      plural: 绘图
    short:
      singular: 绘
      plural: 绘
    verb: 绘图

terms:
  and:
    long: 和
    symbol: 和
  anonymous:
    long: 佚名
    short: 佚名
  et_al:
    long: 等
  no_date:
    long: 无日期
    short: 无日期
  volume:
    long:
      singular: 卷
      plural: 卷
    # Short form carries the CSL-M `%s` circumfix convention (matches the
    # pinned upstream term `第%s卷`): the engine splits on `%s` and wraps the
    # numeric value, rather than treating the whole string as a plain prefix.
    short:
      singular: 第%s卷
      plural: 第%s卷
  edition:
    long:
      singular: 版
      plural: 版
    short:
      singular: 版
      plural: 版

messages:
  number.ordinal: "第{$value}"
  term.and: "和"
  term.and-symbol: "和"
  term.et-al: "等"
  term.no-date: "无日期"
  term.no-date-long: "无日期"
  term.anonymous: "佚名"
  term.anonymous-long: "佚名"
  term.page-label: "页"
  term.page-label-long: "页"
  term.chapter-label: "章"
  term.volume-label: "卷"
  term.section-label: "节"

legacy-term-aliases:
  and: term.and
  et_al: term.et-al
  no_date: term.no-date
  page: term.page-label
  pages: term.page-label

date-formats:
  numeric-short: "yyyy/M/d"
  textual-long: "yyyy年M月"
  textual-full: "yyyy年M月d日"
  bib-default: "yyyy年M月d日"
  year-only: "yyyy"
  iso: "yyyy-MM-dd"

grammar-options:
  punctuation-in-quote: false
  nbsp-before-colon: false
  open-quote: "「"
  close-quote: "」"
  open-inner-quote: "『"
  close-inner-quote: "』"
  serial-comma: false
  page-range-delimiter: "–"
  title-subtitle-delimiter: "："
  subtitle-delimiter: "，"
  strong-terminal-comma-policy: keep-terminal
  delimiter-suppressing-terminal-marks: "？！…"
